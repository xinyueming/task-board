let listViewMode = 'board';                 // 'board' | 'list'
let listSort = { key: 'updatedAt', dir: 'desc' };
let listPage = 1;
let listPageSize = 20;
let listSel = new Set();                    // 已选任务 id

// 列定义：on = 默认显示，opt = 可在「列设置」里开关
const LV_COLUMNS = [
  { key: 'id',          label: '任务编号', on: true,  opt: false, sortable: true  },
  { key: 'title',       label: '任务标题', on: true,  opt: false, sortable: true  },
  { key: 'status',      label: '状态',     on: true,  opt: false, sortable: true  },
  { key: 'priority',    label: '优先级',   on: true,  opt: false, sortable: true  },
  { key: 'assignee',    label: '负责人',   on: true,  opt: false, sortable: true  },
  { key: 'department',  label: '所属部门', on: true,  opt: false, sortable: true  },
  { key: 'dueDate',     label: '截止时间', on: true,  opt: false, sortable: true  },
  { key: 'updatedAt',   label: '最后更新', on: true,  opt: false, sortable: true  },
  { key: 'source',      label: '客户来源', on: false, opt: true,  sortable: true  },
  { key: 'tags',        label: '标签',     on: false, opt: true,  sortable: false },
  { key: 'createdAt',   label: '创建时间', on: false, opt: true,  sortable: true  },
  { key: 'startedAt',   label: '开始时间', on: false, opt: true,  sortable: true  },
  { key: 'completedAt', label: '完成时间', on: false, opt: true,  sortable: true  },
  { key: 'cancelledAt', label: '取消时间', on: false, opt: true,  sortable: true  },
  { key: 'elapsed',     label: '已耗时',   on: false, opt: true,  sortable: false }
];
let lvColOn = {};                           // key -> bool

const LV_PREFS_KEY = 'kanban_list_prefs';

function loadListPrefs() {
  let p = {};
  try {
    const raw = localStorage.getItem(LV_PREFS_KEY);
    if (raw) p = JSON.parse(raw) || {};
  } catch (e) { p = {}; }

  listPageSize = ([20, 50, 100].indexOf(Number(p.pageSize)) >= 0) ? Number(p.pageSize) : 20;

  const sortOk = LV_COLUMNS.some(c => c.key === p.sortKey && c.sortable);
  listSort = {
    key: sortOk ? p.sortKey : 'updatedAt',
    dir: p.sortDir === 'asc' ? 'asc' : 'desc'
  };

  LV_COLUMNS.forEach(c => { lvColOn[c.key] = c.on; });
  if (p.cols && typeof p.cols === 'object') {
    Object.keys(p.cols).forEach(k => {
      const col = LV_COLUMNS.find(c => c.key === k);
      if (col && col.opt) lvColOn[k] = !!p.cols[k];
    });
  }
  listViewMode = p.view === 'list' ? 'list' : 'board';
}

function saveListPrefs() {
  try {
    localStorage.setItem(LV_PREFS_KEY, JSON.stringify({
      pageSize: listPageSize,
      sortKey: listSort.key,
      sortDir: listSort.dir,
      cols: lvColOn,
      view: listViewMode
    }));
  } catch (e) { /* 忽略隐私模式等写入失败 */ }
}

function visibleListCols() {
  return LV_COLUMNS.filter(c => lvColOn[c.key]);
}

// ---- 单元格渲染 ----
function lvCellHtml(t, col) {
  const dim = '<span class="lv-dim">—</span>';
  switch (col.key) {
    case 'id':         return `<span class="lv-id">${escHtml(t.id)}</span>`;
    case 'title':      return `<span class="lv-title">${escHtml(t.title)}</span>`;
    case 'status':     return `<span class="dr-badge ${t.status}">${escHtml(STATUS_LABELS[t.status] || t.status)}</span>`;
    case 'priority': {
      const p = t.priority || 'P2';
      const cls = p === 'P0' ? 'p0' : (p === 'P1' ? 'p1' : '');
      return `<span class="dr-badge ${cls}">${escHtml(p)}</span>`;
    }
    case 'assignee':   return t.assignee   ? escHtml(t.assignee)   : dim;
    case 'department': return t.department ? escHtml(t.department) : dim;
    case 'source':     return t.source     ? escHtml(t.source)     : dim;
    case 'dueDate': {
      if (!t.dueDate) return dim;
      const over = isOverdue(t);
      return `<span class="${over ? 'lv-over' : ''}">${escHtml(fmtDue(t.dueDate))}${over ? ' 已超期' : ''}</span>`;
    }
    case 'elapsed': {
      const el = elapsedText(t);
      return el ? escHtml(el) : dim;
    }
    case 'tags': {
      const tags = Array.isArray(t.tags) ? t.tags : [];
      return tags.length
        ? tags.map(x => `<span class="dr-tag">${escHtml(x)}</span>`).join(' ')
        : dim;
    }
    case 'createdAt':
    case 'startedAt':
    case 'completedAt':
    case 'cancelledAt':
    case 'updatedAt': {
      const v = t[col.key];
      return v ? escHtml(shortTime(v)) : dim;
    }
    default: return '';
  }
}

// ---- 排序 ----
const LV_PRIO_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3 };
const LV_STATUS_ORDER = { pending: 0, processing: 1, completed: 2, cancelled: 3 };

function lvMissing(t, key) {
  if (key === 'elapsed') return !elapsedText(t);
  if (key === 'priority') return false;
  return !t[key];
}

function lvSortValue(t, key) {
  switch (key) {
    case 'priority': return LV_PRIO_ORDER[t.priority || 'P2'];
    case 'status':   return LV_STATUS_ORDER[t.status];
    case 'dueDate':  return new Date(t.dueDate + 'T00:00:00').getTime();
    case 'createdAt': case 'startedAt': case 'completedAt': case 'cancelledAt': case 'updatedAt':
      return new Date(t[key]).getTime();
    default: return String(t[key] == null ? '' : t[key]);
  }
}

function lvCompare(a, b, key) {
  const va = lvSortValue(a, key);
  const vb = lvSortValue(b, key);
  if (typeof va === 'number' && typeof vb === 'number') {
    if (va === vb) return 0;
    if (isNaN(va)) return 1;
    if (isNaN(vb)) return -1;
    return va < vb ? -1 : 1;
  }
  return String(va).localeCompare(String(vb), 'zh-CN');
}

// 空值永远排在最后，不随升降序翻转
function sortListRows(rows) {
  const key = listSort.key;
  const dir = listSort.dir;
  if (!key || !dir) return rows;
  const s = dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const ma = lvMissing(a, key);
    const mb = lvMissing(b, key);
    if (ma && mb) return 0;
    if (ma) return 1;
    if (mb) return -1;
    return lvCompare(a, b, key) * s;
  });
}

function sortListBy(key) {
  const col = LV_COLUMNS.find(c => c.key === key);
  if (!col || !col.sortable) return;
  if (listSort.key !== key) { listSort.key = key; listSort.dir = 'asc'; }
  else if (listSort.dir === 'asc') { listSort.dir = 'desc'; }
  else if (listSort.dir === 'desc') { listSort.key = ''; listSort.dir = ''; }
  else { listSort.key = key; listSort.dir = 'asc'; }
  listPage = 1;
  saveListPrefs();
  renderList();
}

// ---- 分页 ----
function listGoPage(delta) {
  const pages = Math.max(1, Math.ceil(sortListRows(getFilteredTasks()).length / listPageSize));
  const next = listPage + delta;
  if (next < 1 || next > pages) return;
  listPage = next;
  renderList();
}

function listPageRows(rows) {
  const start = (listPage - 1) * listPageSize;
  return rows.slice(start, start + listPageSize);
}

// ---- 选择 ----
function toggleListSel(id) {
  if (listSel.has(id)) listSel.delete(id); else listSel.add(id);
  renderList();
}

function toggleListSelAll() {
  const rows = listPageRows(sortListRows(getFilteredTasks()));
  const allSel = rows.length > 0 && rows.every(t => listSel.has(t.id));
  rows.forEach(t => { if (allSel) listSel.delete(t.id); else listSel.add(t.id); });
  renderList();
}

function clearListSelection() {
  listSel.clear();
  renderList();
}

function toggleListCol(key, on) {
  const col = LV_COLUMNS.find(c => c.key === key);
  if (!col || !col.opt) return;
  lvColOn[key] = !!on;
  saveListPrefs();
  renderList();
}

// ---- 渲染 ----
function renderList() {
  const lv = document.getElementById('listView');
  if (!lv || listViewMode !== 'list') return;

  // 清理已不存在（被删除）的选中项
  const alive = new Set(tasks.map(t => t.id));
  Array.from(listSel).forEach(id => { if (!alive.has(id)) listSel.delete(id); });

  const rows = sortListRows(getFilteredTasks());
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / listPageSize));
  if (listPage > pages) listPage = pages;
  if (listPage < 1) listPage = 1;
  const pageRows = listPageRows(rows);

  renderListHead(pageRows);
  renderListBody(pageRows);
  renderListFoot(total, pages, pageRows);
  renderListBar();
  renderListColsMenu();
}

function renderListHead(pageRows) {
  const cols = visibleListCols();
  const allSel = pageRows.length > 0 && pageRows.every(t => listSel.has(t.id));
  const someSel = pageRows.some(t => listSel.has(t.id));
  let h = `<tr><th class="lv-ck"><input type="checkbox" ${allSel ? 'checked' : ''}`
    + ` title="全选本页" onclick="event.stopPropagation(); toggleListSelAll()"></th>`;
  cols.forEach(c => {
    const active = !!listSort.key && listSort.key === c.key;
    const arrow = active ? (listSort.dir === 'asc' ? '▲' : '▼') : '';
    const click = c.sortable ? ` onclick="sortListBy('${c.key}')"` : '';
    h += `<th class="${c.sortable ? 'sortable' : ''}"${click}>`
      + escHtml(c.label) + (arrow ? `<span class="lv-sarrow">${arrow}</span>` : '') + '</th>';
  });
  const head = document.getElementById('lvHead');
  head.innerHTML = h + '</tr>';
  const box = head.querySelector('input');
  if (box && someSel && !allSel) box.indeterminate = true;
}

function renderListBody(pageRows) {
  const body = document.getElementById('lvBody');
  const emp = document.getElementById('lvEmpty');
  if (!pageRows.length) {
    body.innerHTML = '';
    emp.style.display = '';
    emp.innerHTML = '<div class="t">没有符合条件的任务</div>'
      + '<div class="s">试试调整上方的搜索或筛选条件</div>';
    return;
  }
  emp.style.display = 'none';
  const cols = visibleListCols();
  body.innerHTML = pageRows.map(t => {
    const sel = listSel.has(t.id);
    const tds = cols.map(c =>
      `<td data-label="${escHtml(c.label)}">${lvCellHtml(t, c)}</td>`).join('');
    return `<tr class="${sel ? 'sel' : ''}" onclick="showDetail('${t.id}')">`
      + `<td class="lv-ck"><input type="checkbox" ${sel ? 'checked' : ''}`
      + ` onclick="event.stopPropagation(); toggleListSel('${t.id}')"></td>`
      + tds + '</tr>';
  }).join('');
}

function renderListFoot(total, pages, pageRows) {
  const start = total ? (listPage - 1) * listPageSize + 1 : 0;
  const end = start ? start + pageRows.length - 1 : 0;
  const tot = document.getElementById('lvTotal');
  if (tot) {
    tot.innerHTML = total
      ? `共 <b>${total}</b> 条　当前 ${start}–${end}`
      : '共 <b>0</b> 条';
  }
  const pg = document.getElementById('lvPages');
  if (pg) pg.textContent = listPage + ' / ' + pages;
  const prev = document.getElementById('lvPrev');
  const next = document.getElementById('lvNext');
  if (prev) prev.disabled = listPage <= 1;
  if (next) next.disabled = listPage >= pages;
  const ps = document.getElementById('lvPageSize');
  if (ps && String(ps.value) !== String(listPageSize)) ps.value = String(listPageSize);
}

function renderListBar() {
  const bar = document.getElementById('lvBatchBar');
  if (!bar) return;
  bar.classList.toggle('show', listSel.size > 0);
  const c = document.getElementById('lvSelCount');
  if (c) c.textContent = listSel.size;
}

function renderListColsMenu() {
  const m = document.getElementById('lvColsMenu');
  if (!m) return;
  m.innerHTML = LV_COLUMNS.map(c => {
    const locked = c.opt ? '' : ' disabled';
    return `<label class="lv-col-item${c.opt ? '' : ' locked'}">`
      + `<input type="checkbox" ${lvColOn[c.key] ? 'checked' : ''}${locked}`
      + ` onchange="toggleListCol('${c.key}', this.checked)">`
      + escHtml(c.label) + '</label>';
  }).join('');
}

// ---- 视图切换 ----
function setView(mode) {
  listViewMode = mode === 'list' ? 'list' : 'board';
  const isList = listViewMode === 'list';
  const kv = document.getElementById('kanbanView');
  const lv = document.getElementById('listView');
  const vb = document.getElementById('viewBoardBtn');
  const vl = document.getElementById('viewListBtn');
  if (kv) kv.style.display = isList ? 'none' : '';
  if (lv) lv.style.display = isList ? '' : 'none';
  if (vb) vb.classList.toggle('active', !isList);
  if (vl) vl.classList.toggle('active', isList);
  const cm = document.getElementById('lvColsMenu');
  if (cm) cm.classList.remove('show');
  saveListPrefs();
  if (isList) renderList();
}

// 筛选条件变化：两个视图一起刷新（列表要回到第 1 页）
function refreshViews() {
  renderColumns();
  if (listViewMode === 'list') { listPage = 1; renderList(); }
}

// ---- 批量操作 ----
function batchAction(kind) {
  const ids = Array.from(listSel).filter(id => tasks.some(t => t.id === id));
  if (!ids.length) return;

  const eligible = (allowed) => ids.filter(id => {
    const t = tasks.find(x => x.id === id);
    return t && allowed.indexOf(t.status) !== -1;
  });

  if (kind === 'start') {
    const ok = eligible(['pending']);
    if (!ok.length) { alert('选中的任务里没有「待处理」状态的任务。'); return; }
    applyBatchStatus(ok, 'processing', '启动', ids.length);
  } else if (kind === 'complete') {
    const ok = eligible(['pending', 'processing']);
    if (!ok.length) { alert('只有「待处理」或「处理中」的任务可以标记完成。'); return; }
    applyBatchStatus(ok, 'completed', '完成', ids.length);
  } else if (kind === 'cancel') {
    const ok = eligible(['pending', 'processing']);
    if (!ok.length) { alert('只有「待处理」或「处理中」的任务可以取消。'); return; }
    if (ok.length < ids.length) alert(`另有 ${ids.length - ok.length} 个任务状态不适用，将跳过。`);
    pendingCancel = { ids: ok, toStatus: 'cancelled' };
    document.getElementById('cancelReasonInput').value = '';
    openModal('modalCancel');
  } else if (kind === 'delete') {
    if (!confirm(`确定要删除选中的 ${ids.length} 个任务吗？\n任务将移入回收站，7 天后自动清除。`)) return;
    bulkTrash(ids);
  } else if (kind === 'export') {
    exportListCSV(ids);
  }
}

// 批量流转：只写一次云端、渲染一次，避免 N 次全表 upsert
function applyBatchStatus(ids, target, verb, pickedTotal) {
  const moved = [];
  ids.forEach(id => {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    applyStatusFields(t, target);
    moved.push(t);
  });
  if (!moved.length) return;
  const rest = tasks.filter(t => t.status === target && moved.indexOf(t) === -1);
  let n = rest.length;
  moved.forEach(t => { t.order = n++; });
  saveToStorage();
  listSel.clear();
  renderAll();
  if (typeof pickedTotal === 'number' && moved.length < pickedTotal) {
    alert(`已${verb} ${moved.length} 个任务，跳过 ${pickedTotal - moved.length} 个（状态不适用）。`);
  }
}

function bulkTrash(ids) {
  const now = new Date().toISOString();
  let n = 0;
  ids.forEach(id => {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    deletedTasks.push(Object.assign({}, t, { deletedAt: now }));
    n++;
  });
  if (!n) return;
  tasks = tasks.filter(t => ids.indexOf(t.id) === -1);
  gcTrash();
  listSel.clear();
  saveToStorage();
  renderAll();
}

function exportListCSV(ids) {
  const picked = ids.map(id => tasks.find(t => t.id === id)).filter(Boolean);
  if (!picked.length) return;
  const cols = [
    ['任务编号', t => t.id],
    ['标题', t => t.title],
    ['任务描述', t => t.description || ''],
    ['状态', t => STATUS_LABELS[t.status] || t.status],
    ['优先级', t => t.priority || 'P2'],
    ['负责人', t => t.assignee || ''],
    ['所属部门', t => t.department || ''],
    ['客户来源', t => t.source || ''],
    ['截止时间', t => t.dueDate || ''],
    ['标签', t => (Array.isArray(t.tags) ? t.tags.join(' / ') : '')],
    ['创建时间', t => formatTime(t.createdAt)],
    ['开始时间', t => t.startedAt ? formatTime(t.startedAt) : ''],
    ['完成时间', t => t.completedAt ? formatTime(t.completedAt) : ''],
    ['取消时间', t => t.cancelledAt ? formatTime(t.cancelledAt) : ''],
    ['最后更新', t => formatTime(t.updatedAt)],
    ['取消原因', t => t.cancelReason || '']
  ];
  let csv = '\uFEFF';   // BOM，Excel 中文不乱码
  csv += cols.map(c => csvCell(c[0])).join(',') + '\n';
  picked.forEach(t => { csv += cols.map(c => csvCell(c[1](t))).join(',') + '\n'; });
  const d = new Date();
  const stamp = '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `任务列表_选中${picked.length}条_${stamp}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---- 任务卡片 ----
function renderCard(task) {
  const st = task.status;
  const prio = task.priority || 'P2';
  const prioCls = prio === 'P0' ? 'p0' : (prio === 'P1' ? 'p1' : '');
  const stLabel = STATUS_LABELS[st] || st;

  // 部门 / 负责人
  const meta = [];
  if (task.department) meta.push(`<span class="mi">${ICON.dept}<span class="ell">${escHtml(task.department)}</span></span>`);
  if (task.assignee) meta.push(`<span class="mi">${ICON.user}<span class="ell">${escHtml(task.assignee)}</span></span>`);

  // 截止 / 耗时
  const due = [];
  if (task.dueDate) {
    const od = isOverdue(task);
    due.push(`<span class="mi${od ? ' overdue' : ''}">${ICON.cal}${od ? '已超期 ' : '截止 '}${escHtml(fmtDue(task.dueDate))}</span>`);
  }
  const el = elapsedText(task);
  if (el) due.push(`<span class="mi">${ICON.clock}${st === 'completed' || st === 'cancelled' ? '耗时 ' : '已耗时 '}${el}</span>`);

  // 阶段时间
  let whenHtml = '';
  if (st === 'processing' && task.startedAt) {
    whenHtml = `<div class="card-when"><span class="mi">${ICON.play}启动 ${escHtml(shortTime(task.startedAt))}</span></div>`;
  } else if (st === 'completed' && task.completedAt) {
    whenHtml = `<div class="card-when"><span class="mi done">${ICON.check}完成 ${escHtml(shortTime(task.completedAt))}</span></div>`;
  } else if (st === 'cancelled' && task.cancelledAt) {
    whenHtml = `<div class="card-when"><span class="mi cancelled">${ICON.x}取消 ${escHtml(shortTime(task.cancelledAt))}</span></div>`;
  } else if (st === 'pending' && task.createdAt) {
    whenHtml = `<div class="card-when"><span class="mi">创建 ${escHtml(shortTime(task.createdAt))}</span></div>`;
  }

  // 标签
  const tagsHtml = (Array.isArray(task.tags) && task.tags.length)
    ? `<div class="card-tags">${task.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}</div>`
    : '';

  // 快捷操作
  let actions = '';
  if (st === 'pending') {
    actions = `<button class="btn-start" onclick="event.stopPropagation(); actionStart('${task.id}')">启动</button>
               <button class="btn-cancel" onclick="event.stopPropagation(); actionCancel('${task.id}')">取消</button>`;
  } else if (st === 'processing') {
    actions = `<button class="btn-complete" onclick="event.stopPropagation(); actionComplete('${task.id}')">完成</button>
               <button class="btn-cancel" onclick="event.stopPropagation(); actionCancel('${task.id}')">取消</button>`;
  } else if (st === 'cancelled') {
    actions = `<button class="btn-view-reason" onclick="event.stopPropagation(); viewCancelReason('${task.id}')">查看原因</button>`;
  }
  actions += `<button class="btn-delete" onclick="event.stopPropagation(); actionDelete('${task.id}')">删除</button>`;

  return `
    <div class="task-card" draggable="true" data-task-id="${task.id}" data-status="${st}"
         ondragstart="onDragStart(event)" ondragend="onDragEnd(event)"
         onclick="showDetail('${task.id}')">
      <div class="card-top">
        <span class="card-id" onclick="event.stopPropagation(); showDetail('${task.id}')">${escHtml(task.id)}</span>
        <span class="prio ${prioCls}">${escHtml(prio)}</span>
        <span class="spacer"></span>
        <span class="card-status ${st}">${escHtml(stLabel)}</span>
        <button class="card-menu-btn" title="更多操作"
                onclick="toggleCardMenu(event, '${task.id}')">⋯</button>
      </div>
      <div class="card-title" onclick="event.stopPropagation(); showDetail('${task.id}')">${escHtml(task.title)}</div>
      ${meta.length ? `<div class="card-meta">${meta.join('')}</div>` : ''}
      ${due.length ? `<div class="card-meta">${due.join('')}</div>` : ''}
      ${whenHtml}
      ${tagsHtml}
      <div class="task-actions">${actions}</div>
      <div class="card-menu" id="menu-${task.id}">
        <button class="dropdown-item" onclick="event.stopPropagation(); duplicateTask('${task.id}')">复制任务</button>
        <button class="dropdown-item" onclick="event.stopPropagation(); moveTaskMenu('${task.id}')">移动任务</button>
        <div class="dropdown-sep"></div>
        <button class="dropdown-item danger" onclick="event.stopPropagation(); actionDelete('${task.id}')">删除任务</button>
      </div>
    </div>
  `;
}

// ---- 卡片 ⋯ 菜单 ----
function toggleCardMenu(ev, taskId) {
  ev.stopPropagation();
  const el = document.getElementById('menu-' + taskId);
  if (!el) return;
  const open = el.classList.contains('show');
  document.querySelectorAll('.card-menu.show').forEach(m => m.classList.remove('show'));
  if (!open) el.classList.add('show');
}
function closeCardMenus() {
  document.querySelectorAll('.card-menu.show').forEach(m => m.classList.remove('show'));
}

// ---- 复制任务（沿用当前看板状态之外的字段） ----
function duplicateTask(taskId) {
  closeCardMenus();
  const src = tasks.find(t => t.id === taskId);
  if (!src) return;
  const now = new Date().toISOString();
  const sameStatus = tasks.filter(t => t.status === src.status);
  const copy = Object.assign({}, src, {
    id: genTaskId(),
    title: src.title + '（副本）',
    status: 'pending',
    order: tasks.filter(t => t.status === 'pending').length,
    createdAt: now, startedAt: '', completedAt: '', cancelledAt: '',
    cancelReason: '', updatedAt: now
  });
  tasks.push(copy);
  saveToStorage();
  renderAll();
}

// ---- 移动任务（选择目标列） ----
function moveTaskMenu(taskId) {
  closeCardMenus();
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  const opts = ['pending', 'processing', 'completed', 'cancelled']
    .filter(s => s !== task.status)
    .map(s => STATUS_LABELS[s]);
  const pick = prompt('移动到哪一列？（输入序号）\n' + opts.map((o, i) => (i + 1) + '. ' + o).join('\n'));
  const idx = parseInt(pick, 10);
  if (!idx || idx < 1 || idx > opts.length) return;
  const target = ['pending', 'processing', 'completed', 'cancelled'].filter(s => s !== task.status)[idx - 1];
  if (target === 'cancelled') {
    pendingCancel = { taskId: task.id, toStatus: 'cancelled' };
    document.getElementById('cancelReasonInput').value = '';
    openModal('modalCancel');
  } else {
    reorderTask(task.id, target, 999);
  }
}



// 卡片上的短时间格式：MM-DD HH:mm
function shortTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${m}-${day} ${h}:${mi}`;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============================================================
//  RECYCLE BIN (Trash)
// ============================================================
let deletedTasks = [];
let trashExpanded = false;

function gcTrash() {
  const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
  deletedTasks = deletedTasks.filter(t => new Date(t.deletedAt).getTime() > cutoff);
}

function moveToTrash(task) {
  const t = { ...task, deletedAt: new Date().toISOString() };
  deletedTasks.push(t);
  tasks = tasks.filter(t => t.id !== task.id);
  gcTrash();
  saveToStorage();
  renderAll();
}

function restoreTask(taskId) {
  const idx = deletedTasks.findIndex(t => t.id === taskId);
  if (idx === -1) return;
  const task = deletedTasks[idx];
  delete task.deletedAt;
  task.updatedAt = new Date().toISOString();
  // Put back into the same status column, at the end
  const sameStatus = tasks.filter(t => t.status === task.status);
  task.order = sameStatus.length > 0 ? Math.max(...sameStatus.map(t => t.order)) + 1 : 0;
  tasks.push(task);
  deletedTasks.splice(idx, 1);
  saveToStorage();
  renderAll();
}

async function clearTrash() {
  if (deletedTasks.length === 0) return;
  if (!confirm('确定要清空回收站吗？删除的记录将无法恢复。')) return;
  // 物理删除云端已删除的记录
  if (currentUser) {
    const ids = deletedTasks.map(t => t.id);
    const { error } = await sb.from('tasks').delete().in('id', ids).not('deleted_at', 'is', null);
    if (error) console.error('Clear trash delete failed:', error.message);
  }
  deletedTasks = [];
  await saveToStorage();
  renderTrash();
}

function toggleTrash() {
  trashExpanded = !trashExpanded;
  renderTrash();
}

function renderTrash() {
  gcTrash();
  const icon = document.getElementById('trashIcon');
  const panel = document.getElementById('trashPanel');
  const badge = document.getElementById('trashBadge');
  const list = document.getElementById('trashList');
  if (!icon) return;
  // Update badge and panel title count
  badge.textContent = deletedTasks.length;
  badge.style.display = deletedTasks.length > 0 ? 'flex' : 'none';
  const countSpan = document.getElementById('trashCount');
  if (countSpan) countSpan.textContent = deletedTasks.length;
  // Toggle panel
  panel.style.display = trashExpanded ? 'block' : 'none';
  if (!trashExpanded) return;
  // Render list
  if (deletedTasks.length === 0) {
    list.innerHTML = '<div class="trash-empty">回收站为空</div>';
    document.getElementById('trashClearBtn').style.display = 'none';
    return;
  }
  document.getElementById('trashClearBtn').style.display = 'inline-block';
  list.innerHTML = deletedTasks.map(t => {
    const statusLabel = { pending:'待处理', processing:'处理中', completed:'已完成', cancelled:'已取消' };
    const statusColor = { pending:'#4A90D9', processing:'#F5A623', completed:'#7ED321', cancelled:'#9B9B9B' };
    return `<div class="trash-item" data-task-id="${t.id}">
      <div class="trash-item-info">
        <div class="trash-item-id">${escHtml(t.id)}</div>
        <div class="trash-item-title">${escHtml(t.title)}</div>
        <div class="trash-item-meta">
          <span style="color:${statusColor[t.status]}">${statusLabel[t.status]||t.status}</span>
          · 删除于 ${formatTime(t.deletedAt)} · <span style="color:rgba(255,255,255,0.4)">${Math.ceil((Date.now()-new Date(t.deletedAt).getTime())/(24*60*60*1000))}天前</span>
        </div>
      </div>
      <button class="btn-restore" onclick="restoreTask('${t.id}')">↩ 恢复</button>
    </div>`;
  }).join('');
}

// 取消确认（服务于：按钮触发、拖拽触发带 toIndex、列表批量触发带 ids）
function doConfirmCancel() {
  const reason = document.getElementById('cancelReasonInput').value.trim();
  if (!reason) {
    document.getElementById('cancelReasonInput').style.borderColor = '#ff6b6b';
    document.getElementById('cancelReasonInput').placeholder = '请填写取消原因（必填）';
    return;
  }
  if (pendingCancel) {
    const toStatus = pendingCancel.toStatus || 'cancelled';
    const ids = (Array.isArray(pendingCancel.ids) && pendingCancel.ids.length)
      ? pendingCancel.ids
      : (pendingCancel.taskId ? [pendingCancel.taskId] : []);
    const moved = [];
    ids.forEach(id => {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      applyStatusFields(task, toStatus, { reason: reason });
      moved.push(task);
    });
    if (moved.length) {
      const rest = tasks.filter(t => t.status === toStatus && moved.indexOf(t) === -1);
      const idx = (moved.length === 1) ? pendingCancel.toIndex : undefined;
      if (idx !== undefined && idx <= rest.length) {
        rest.splice(idx, 0, moved[0]);
      } else {
        Array.prototype.push.apply(rest, moved);
      }
      rest.forEach((t, i) => t.order = i);
      saveToStorage();
      renderAll();
      // 抽屉打开时同步刷新，避免详情停留在旧状态
      const _dw = document.getElementById('taskDrawer');
      if (_dw && _dw.classList.contains('show')) {
        if (drawerTaskId && tasks.some(t => t.id === drawerTaskId)) showDetail(drawerTaskId);
        else closeTaskDrawer();
      }
    }
    pendingCancel = null;
  }
  closeModal('modalCancel');
}

// ============================================================
let drawerTaskId = null;   // 当前抽屉展示的任务 id

// 由现有时间戳推导操作日志（真实数据，无需额外表）
function buildActivityLog(task) {
  const who = task.assignee || '—';
  const items = [];
  if (task.createdAt) items.push({ time: task.createdAt, who, what: '创建任务', kind: 'done' });
  if (task.startedAt) items.push({ time: task.startedAt, who, what: '开始处理', kind: 'done' });
  if (task.completedAt) items.push({ time: task.completedAt, who, what: '标记为已完成', kind: 'done' });
  if (task.cancelledAt) items.push({
    time: task.cancelledAt, who,
    what: '取消任务' + (task.cancelReason ? '：' + task.cancelReason : ''),
    kind: 'done'
  });
  items.sort((a, b) => new Date(a.time) - new Date(b.time));
  // 最后一项标记为「当前节点」
  if (items.length) items[items.length - 1].kind = 'now';
  return items;
}

function showDetail(taskId) {
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  drawerTaskId = taskId;
  const st = task.status;
  const stLabel = STATUS_LABELS[st] || st;
  const prio = task.priority || 'P2';
  const prioCls = prio === 'P0' ? 'p0' : (prio === 'P1' ? 'p1' : '');
  const dotColor = {
    pending: 'var(--st-pending)', processing: 'var(--st-processing)',
    completed: 'var(--st-completed)', cancelled: 'var(--st-cancelled)'
  }[st] || 'var(--text-3)';

  // 头部
  const dot = document.getElementById('drawerDot');
  if (dot) dot.style.background = dotColor;
  const ht = document.getElementById('drawerHeadTitle');

  const item = (k, v) => `<div class="dr-item"><div class="k">${escHtml(k)}</div><div class="v">${v}</div></div>`;
  const dash = '<span style="color:var(--text-3)">—</span>';
  const fmt = (t) => t ? escHtml(formatTime(t)) : dash;

  // 基本信息
  const basic = [
    item('负责人', task.assignee ? escHtml(task.assignee) : dash),
    item('所属部门', task.department ? escHtml(task.department) : dash),
    item('客户来源', task.source ? escHtml(task.source) : dash),
    item('优先级', `<span class="dr-badge ${prioCls}">${escHtml(prio)}</span>`),

    item('已耗时', elapsedText(task) ? escHtml(elapsedText(task)) : dash)
  ].join('');

  // 时间线
  const timeline = [
    item('创建时间', fmt(task.createdAt)),
    item('开始时间', fmt(task.startedAt)),
    item('完成时间', fmt(task.completedAt)),
    item('取消时间', fmt(task.cancelledAt)),
    item('最后更新', fmt(task.updatedAt))
  ].join('');

  // 操作日志
  const log = buildActivityLog(task);
  const logHtml = log.length
    ? `<div class="dr-log">${log.map(x => `
        <div class="dr-log-item ${x.kind === 'now' ? 'now' : ''}">
          <div class="dr-log-when">${escHtml(formatTime(x.time))}</div>
          <div class="dr-log-what">${escHtml(x.what)}</div>
          <div class="dr-log-who">${escHtml(x.who)}</div>
        </div>`).join('')}</div>`
    : '<div class="dr-empty">暂无操作记录</div>';

  const body = `
    <div class="dr-title-wrap">
      <div class="dr-id">${escHtml(task.id)}</div>
      <div class="dr-title">${escHtml(task.title)}</div>
      <div class="dr-badges">
        <span class="dr-badge ${st}">${escHtml(stLabel)}</span>
        <span class="dr-badge ${prioCls}">${escHtml(prio)}</span>
      </div>
    </div>

    <div class="dr-sec">
      <div class="dr-sec-title">基本信息</div>
      <div class="dr-grid">${basic}</div>
    </div>

    <div class="dr-sec">
      <div class="dr-sec-title">时间线</div>
      <div class="dr-grid">${timeline}</div>
    </div>

    <div class="dr-sec">
      <div class="dr-sec-title">任务描述</div>
      ${task.description ? `<div class="dr-desc">${escHtml(task.description)}</div>` : '<div class="dr-empty">暂无描述</div>'}
    </div>

    ${task.cancelReason ? `
    <div class="dr-sec">
      <div class="dr-sec-title">取消原因</div>
      <div class="dr-reason">${escHtml(task.cancelReason)}</div>
    </div>` : ''}

    ${(Array.isArray(task.tags) && task.tags.length) ? `
    <div class="dr-sec">
      <div class="dr-sec-title">任务标签</div>
      <div class="dr-tags">${task.tags.map(t => `<span class="dr-tag">${escHtml(t)}</span>`).join('')}</div>
    </div>` : ''}

    <div class="dr-sec">
      <div class="dr-sec-title">处理记录</div>
      ${logHtml}
    </div>

    <div class="dr-sec">
      <div class="dr-sec-title">附件与评论</div>
      <div class="dr-empty">暂未启用（后续阶段实现）</div>
    </div>

  document.getElementById('drawerBody').innerHTML = body;

  // 底部操作
  let foot = '';
  if (st === 'pending') {
    foot += `<button class="primary" onclick="drawerAction('start','${task.id}')">启动任务</button>`;
    foot += `<button onclick="drawerAction('cancel','${task.id}')">取消任务</button>`;
  } else if (st === 'processing') {
    foot += `<button class="primary" onclick="drawerAction('complete','${task.id}')">完成任务</button>`;
    foot += `<button onclick="drawerAction('cancel','${task.id}')">取消任务</button>`;
  } else if (st === 'completed') {
    foot += `<button class="ok" onclick="drawerAction('reopen','${task.id}')">重新打开</button>`;
  } else if (st === 'cancelled') {
    foot += `<button class="ok" onclick="drawerAction('restart','${task.id}')">重启任务</button>`;
  }
  foot += `<button class="danger" onclick="drawerAction('delete','${task.id}')">删除</button>`;
  document.getElementById('drawerFoot').innerHTML = foot;

  // 打开
  document.getElementById('drawerOverlay').classList.add('show');
  const dr = document.getElementById('taskDrawer');
  dr.classList.add('show');
  dr.setAttribute('aria-hidden', 'false');
}

function closeTaskDrawer() {
  drawerTaskId = null;
  document.getElementById('drawerOverlay').classList.remove('show');
  const dr = document.getElementById('taskDrawer');
  if (dr) { dr.classList.remove('show'); dr.setAttribute('aria-hidden', 'true'); }
}

// Drawer 内的操作
function drawerAction(kind, taskId) {
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  if (kind === 'start') { updateTaskStatus(taskId, 'processing'); showDetail(taskId); }
  else if (kind === 'complete') { updateTaskStatus(taskId, 'completed'); showDetail(taskId); }
  else if (kind === 'reopen') { updateTaskStatus(taskId, 'processing'); showDetail(taskId); }
  else if (kind === 'restart') { updateTaskStatus(taskId, 'processing'); showDetail(taskId); }
  else if (kind === 'cancel') {
    pendingCancel = { taskId, toStatus: 'cancelled' };
    document.getElementById('cancelReasonInput').value = '';
    openModal('modalCancel');
  } else if (kind === 'delete') {
    closeTaskDrawer();
    actionDelete(taskId);
  }
}



function formatTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  const s = String(d.getSeconds()).padStart(2, '0');
  return `${y}-${m}-${day} ${h}:${min}:${s}`;
}

let dragTaskId = null;
let dragFromStatus = null;
let dragPlaceholder = null;

function onDragStart(e) {
  const card = e.target.closest('.task-card');
  if (!card) return;
  dragTaskId = card.dataset.taskId;
  const task = tasks.find(t => t.id === dragTaskId);
  if (!task) { e.preventDefault(); return; }
  dragFromStatus = task.status;
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragTaskId);
  // Hide empty hints during drag
  document.querySelectorAll('.empty-hint').forEach(el => el.style.display = 'none');
}

function onDragEnd(e) {
  const card = e.target.closest('.task-card');
  if (card) card.classList.remove('dragging');
  document.querySelectorAll('.column-body').forEach(el => {
    el.classList.remove('drag-over');
  });
  document.querySelectorAll('.task-card').forEach(el => {
    el.classList.remove('drag-indicator-top', 'drag-indicator-bottom');
  });
  document.querySelectorAll('.empty-hint').forEach(el => el.style.display = '');
  dragTaskId = null;
  dragFromStatus = null;
}

// Setup global drag/drop events
document.addEventListener('DOMContentLoaded', () => {
  document.addEventListener('dragstart', (e) => {
    const card = e.target.closest('.task-card');
    if (!card) return;
    onDragStart(e);
  });
  document.addEventListener('dragend', (e) => {
    const card = e.target.closest('.task-card');
    if (card) onDragEnd(e);
  });
  document.addEventListener('dragover', (e) => {
    // Trash icon drag-over
    if (e.target.closest('#trashIcon')) {
      if (!dragTaskId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.getElementById('trashIcon').classList.add('drag-over');
      return;
    }
    const col = e.target.closest('.column-body');
    if (!col || !dragTaskId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    col.classList.add('drag-over');
    // Show insertion indicator
    const cards = [...col.querySelectorAll('.task-card')];
    cards.forEach(c => c.classList.remove('drag-indicator-top', 'drag-indicator-bottom'));
    const targetCard = e.target.closest('.task-card');
    if (targetCard) {
      const rect = targetCard.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      if (e.clientY < midY) {
        targetCard.classList.add('drag-indicator-top');
      } else {
        targetCard.classList.add('drag-indicator-bottom');
      }
    }
  });
  document.addEventListener('dragleave', (e) => {
    // Trash icon dragleave
    if (e.target.closest('#trashIcon') && !e.relatedTarget?.closest('#trashIcon')) {
      document.getElementById('trashIcon').classList.remove('drag-over');
    }
    const col = e.target.closest('.column-body');
    if (col) {
      setTimeout(() => {
        if (!col.contains(e.relatedTarget)) {
          col.classList.remove('drag-over');
        }
      }, 10);
    }
    const card = e.target.closest('.task-card');
    if (card) {
      card.classList.remove('drag-indicator-top', 'drag-indicator-bottom');
    }
    
  });
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    // Check if dropped on trash icon
    if (e.target.closest('#trashIcon')) {
      if (dragTaskId) {
        document.getElementById('trashIcon').classList.remove('drag-over');
        const task = tasks.find(t => t.id === dragTaskId);
        if (task && confirm(`确定要删除任务「${task.id} - ${task.title}」吗？`)) {
          moveToTrash(task);
        }
      }
      dragTaskId = null;
      return;
    }
    const col = e.target.closest('.column-body');
    if (!col || !dragTaskId) return;
    const toStatus = col.dataset.status;
    const task = tasks.find(t => t.id === dragTaskId);
    if (!task) return;
    // Calculate insertion index
    const cards = [...col.querySelectorAll('.task-card')];
    let targetIndex = cards.length; // default: end
    const targetCard = e.target.closest('.task-card');
    if (targetCard) {
      const idx = cards.indexOf(targetCard);
      if (idx !== -1) {
        const rect = targetCard.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        targetIndex = e.clientY < midY ? idx : idx + 1;
      }
    }
    // If same column, just reorder
    if (toStatus === dragFromStatus) {
      reorderTask(dragTaskId, toStatus, targetIndex);
    } else {
      // Moving to different column
      if (toStatus === 'cancelled') {
        // Need cancel reason
        pendingCancel = { taskId: dragTaskId, toStatus, toIndex: targetIndex };
        document.getElementById('cancelReasonInput').value = '';
        openModal('modalCancel');
        // The modal confirm will handle the move
      } else {
        reorderTask(dragTaskId, toStatus, targetIndex);
      }
    }
    // Cleanup
    document.querySelectorAll('.column-body').forEach(el => el.classList.remove('drag-over'));
    document.querySelectorAll('.task-card').forEach(el => {
      el.classList.remove('drag-indicator-top', 'drag-indicator-bottom');
    });
    document.querySelectorAll('.empty-hint').forEach(el => el.style.display = '');
    dragTaskId = null;
    dragFromStatus = null;
  });
});

document.addEventListener('DOMContentLoaded', () => {
  const trashWrap = document.getElementById('trashContainer');
  if (!trashWrap) return;
  let isDragging = false, startX, startY, origX, origY;

  function getTrashTransform() {
    const match = trashWrap.style.transform.match(/translate\(([^,]+),\s*([^)]+)\)/);
    if (match) return { x: parseFloat(match[1]), y: parseFloat(match[2]) };
    return { x: 0, y: 0 };
  }

  trashWrap.addEventListener('mousedown', (e) => {
    const panel = document.getElementById('trashPanel');
    if (panel && panel.style.display === 'block') {
      if (e.target.closest('.trash-panel')) return;
    }
    if (e.target.closest('.trash-panel') || e.target.closest('.btn-trash-clear')) return;
    isDragging = false;
    startX = e.clientX;
    startY = e.clientY;
    const t = getTrashTransform();
    origX = t.x;
    origY = t.y;
    trashWrap.style.cursor = 'grabbing';
    trashWrap.classList.add('dragging');

    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;
      if (isDragging) {
        trashWrap.style.transform = `translate(${origX + dx}px, ${origY + dy}px)`;
        trashWrap.style.transition = 'none';
      }
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      trashWrap.style.cursor = '';
      trashWrap.classList.remove('dragging');
      trashWrap.style.transition = '';
      if (!isDragging) {
        toggleTrash();
      }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
});

// ============================================================
//  STATISTICS
// ============================================================
// 统计口径：
//  · 待处理 / 处理中 → 当前存量，忽略统计区间
//  · 已完成 → 按「完成时间」落在区间内
//  · 已取消 → 按「取消时间」落在区间内
//  时间戳缺失时回落到 最后更新 → 创建时间
function pickTime(task, field) {
  return task[field] || task.updatedAt || task.createdAt || '';
}
function inRange(iso, start, end) {
  if (!iso) return true;   // 无任何时间信息时，视为命中（避免漏统计）
  const t = new Date(iso);
  if (isNaN(t.getTime())) return true;
  return t >= start && t <= end;
}
// 返回 { counts, list } —— list 为命中区间的任务（用于明细导出/AI 汇报）
function computeStats() {
  const startVal = document.getElementById('statsStart').value;
  const endVal = document.getElementById('statsEnd').value;
  const start = startVal ? new Date(startVal + 'T00:00:00+08:00') : new Date(0);
  const end = endVal ? new Date(endVal + 'T23:59:59+08:00') : new Date();
  const counts = { pending: 0, processing: 0, completed: 0, cancelled: 0 };
  const list = [];
  tasks.forEach(t => {
    let hit = false;
    if (t.status === 'pending' || t.status === 'processing') {
      hit = true;                                   // 存量：始终计入
    } else if (t.status === 'completed') {
      hit = inRange(pickTime(t, 'completedAt'), start, end);
    } else if (t.status === 'cancelled') {
      hit = inRange(pickTime(t, 'cancelledAt'), start, end);
    }
    if (hit) {
      if (counts.hasOwnProperty(t.status)) counts[t.status]++;
      list.push(t);
    }
  });
  return { startVal, endVal, start, end, counts, list };
}

// ---- 单条 KPI 计算辅助 ----
function _countCreated(s, e) { return tasks.filter(t => inRange(t.createdAt, s, e)).length; }
function _countCompleted(s, e) { return tasks.filter(t => t.status === 'completed' && inRange(pickTime(t, 'completedAt'), s, e)).length; }
function _countCancelled(s, e) { return tasks.filter(t => t.status === 'cancelled' && inRange(pickTime(t, 'cancelledAt'), s, e)).length; }
function _countProcessingAt(when) {
  return tasks.filter(t => {
    if (!t.startedAt) return false;
    const st = new Date(t.startedAt);
    if (isNaN(st.getTime()) || st > when) return false;
    const done = t.completedAt ? new Date(t.completedAt) : null;
    return !done || done > when;
  }).length;
}
function _totalAt(when) { return tasks.filter(t => inRange(t.createdAt, new Date(0), when)).length; }
function _avgHours(s, e) {
  let sum = 0, n = 0;
  tasks.forEach(t => {
    if (t.status !== 'completed') return;
    if (!inRange(pickTime(t, 'completedAt'), s, e)) return;
    if (!t.startedAt || !t.completedAt) return;
    const ms = new Date(t.completedAt) - new Date(t.startedAt);
    if (ms > 0) { sum += ms; n++; }
  });
  return n ? sum / n / 3600000 : 0;
}
function _onTimeRate(s, e) {
  const done = tasks.filter(t => t.status === 'completed' && inRange(pickTime(t, 'completedAt'), s, e));
  if (!done.length) return null;
  const ok = done.filter(t => {
    if (!t.dueDate) return true;               // 无截止时间视为按时
    const due = new Date(t.dueDate + 'T23:59:59');
    const cmp = new Date(pickTime(t, 'completedAt'));
    return isNaN(due.getTime()) || cmp <= due;
  }).length;
  return Math.round((ok / done.length) * 100);
}
function _overdueAt(when) {
  return tasks.filter(t => {
    if (t.status === 'completed' || t.status === 'cancelled') return false;
    if (!t.dueDate) return false;
    const d = new Date(t.dueDate + 'T23:59:59');
    return !isNaN(d.getTime()) && d < when;
  }).length;
}

// 8 个核心 KPI（含与上一周期对比）
function computeKpis() {
  const { start, end } = computeStats();
  const len = Math.max(1, end - start);
  const pEnd = new Date(start.getTime() - 1);
  const pStart = new Date(start.getTime() - len);
  const now = new Date();

  const mk = (key, label, icon, cur, prev, opts) => ({
    key, label, icon,
    cur: cur == null ? 0 : cur,
    prev: prev == null ? 0 : prev,
    unit: (opts && opts.unit) || '',
    betterWhen: (opts && opts.betterWhen) || 'none',
    tone: (opts && opts.tone) || 't-blue',
    decimals: (opts && opts.decimals) || 0
  });

  return [
    mk('total', '任务总数', ICON_KPI.box, _totalAt(end), _totalAt(pEnd), { tone: 't-blue' }),
    mk('created', '新增任务', ICON_KPI.plus, _countCreated(start, end), _countCreated(pStart, pEnd), { tone: 't-indigo' }),
    mk('done', '完成任务', ICON_KPI.check, _countCompleted(start, end), _countCompleted(pStart, pEnd), { tone: 't-green' }),
    mk('cancelled', '取消任务', ICON_KPI.x, _countCancelled(start, end), _countCancelled(pStart, pEnd), { tone: 't-gray' }),
    mk('avg', '平均处理时长', ICON_KPI.clock, _avgHours(start, end), _avgHours(pStart, pEnd),
       { unit: 'h', betterWhen: 'down', decimals: 1, tone: 't-sky' }),
    mk('ontime', '按时完成率', ICON_KPI.shield, _onTimeRate(start, end), _onTimeRate(pStart, pEnd),
       { unit: '%', betterWhen: 'up', tone: 't-purple' }),
    mk('overdue', '超期任务', ICON_KPI.alert, _overdueAt(now), _overdueAt(pEnd), { betterWhen: 'down', tone: 't-red' }),
    mk('processing', '当前处理中', ICON_KPI.play, _countProcessingAt(now), _countProcessingAt(pEnd), { tone: 't-pink' })
  ];
}

function renderKpis() {
  const grid = document.getElementById('kpiGrid');
  if (!grid) return;
  const list = computeKpis();
  grid.innerHTML = list.map(k => {
    const cur = k.decimals ? Number(k.cur).toFixed(k.decimals) : Math.round(k.cur);
    const diff = k.cur - k.prev;
    const absDiff = k.decimals ? Math.abs(diff).toFixed(k.decimals) : Math.round(Math.abs(diff));
    let cls = 'flat', arrow = '—';
    if (Math.abs(diff) > 1e-9) {
      const up = diff > 0;
      arrow = up ? '↑' : '↓';
      if (k.betterWhen === 'none') cls = 'flat';
      else cls = ((k.betterWhen === 'up') === up) ? 'up' : 'down';
    }
    const deltaTxt = Math.abs(diff) <= 1e-9
      ? '<span class="flat">— 与上期持平</span>'
      : `<span class="${cls}">${arrow} ${absDiff}${k.unit}</span><span>较上期</span>`;
    return `<div class="kpi">
        <div class="kpi-top"><span class="kpi-ic ${k.tone}">${k.icon}</span><span class="kpi-label">${escHtml(k.label)}</span></div>
        <div class="kpi-val">${cur}<span class="unit">${k.unit}</span></div>
        <div class="kpi-delta">${deltaTxt}</div>
      </div>`;
  }).join('');
}

// ---- 任务趋势折线图（自绘 SVG，无第三方依赖） ----
const TREND_SERIES = [
  { key: 'created',   name: '新增任务',   color: 'var(--st-pending)' },
  { key: 'completed', name: '完成任务',   color: 'var(--st-completed)' },
  { key: 'progress',  name: '处理中任务', color: 'var(--st-processing)' }
];

function computeTrend() {
  const trendSel = document.getElementById('trendRange');
  const rng = calcQuickRange(trendSel ? trendSel.value : 'week');
  const start = rng.start, end = rng.end;
  const days = [];
  const oneDay = 86400000;
  let cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const last = new Date(end.getFullYear(), end.getMonth(), end.getDate());
  let guard = 0;
  while (cur <= last && guard < 400) {
    const dayStart = new Date(cur.getTime());
    const dayEnd = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate(), 23, 59, 59, 999);
    days.push({
      date: new Date(cur.getTime()),
      created: tasks.filter(t => inRange(t.createdAt, dayStart, dayEnd)).length,
      completed: tasks.filter(t => t.status === 'completed' && inRange(pickTime(t, 'completedAt'), dayStart, dayEnd)).length,
      progress: _countProcessingAt(dayEnd)
    });
    cur = new Date(cur.getTime() + oneDay);
    guard++;
  }
  return days;
}

function renderTrendChart() {
  const svg = document.getElementById('trendChart');
  if (!svg) return;
  const wrap = svg.parentElement;
  const W = Math.max(280, wrap.clientWidth || 420);
  const H = Math.max(110, wrap.clientHeight || 150);
  const padL = 30, padR = 10, padT = 10, padB = 24;
  const days = computeTrend();

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.innerHTML = '';

  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

  const maxV = Math.max(1, ...days.flatMap(d => [d.created, d.completed, d.progress]));
  const yMax = maxV <= 4 ? 4 : Math.ceil(maxV / 2) * 2;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const xAt = i => days.length <= 1 ? padL + innerW / 2 : padL + (i * innerW) / (days.length - 1);
  const yAt = v => padT + innerH - (v / yMax) * innerH;

  // 网格 + Y 轴刻度
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = (yMax / ticks) * i;
    const y = yAt(v);
    svg.appendChild(el('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: 'var(--bd-soft)', 'stroke-width': 1 }));
    const t = el('text', { x: padL - 7, y: y + 3.5, 'text-anchor': 'end', 'font-size': 10, fill: 'var(--text-3)' });
    t.textContent = String(Math.round(v));
    svg.appendChild(t);
  }

  // X 轴标签（超过 10 天则抽样显示）
  const step = days.length > 10 ? Math.ceil(days.length / 7) : 1;
  days.forEach((d, i) => {
    if (i % step !== 0 && i !== days.length - 1) return;
    const t = el('text', { x: xAt(i), y: H - 7, 'text-anchor': 'middle', 'font-size': 10, fill: 'var(--text-3)' });
    t.textContent = String(d.date.getMonth() + 1).padStart(2, '0') + '/' + String(d.date.getDate()).padStart(2, '0');
    svg.appendChild(t);
  });

  // 三条折线 + 圆点
  TREND_SERIES.forEach(s => {
    const pts = days.map((d, i) => [xAt(i), yAt(d[s.key])]);
    if (pts.length) {
      svg.appendChild(el('polyline', {
        points: pts.map(p => p.join(',')).join(' '),
        fill: 'none', stroke: s.color, 'stroke-width': 2,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round'
      }));
      pts.forEach(p => svg.appendChild(el('circle', {
        cx: p[0], cy: p[1], r: 2.6, fill: 'var(--surface)', stroke: s.color, 'stroke-width': 2
      })));
    }
  });

  // 悬停热区 + tooltip
  const tip = document.getElementById('chartTip');
  days.forEach((d, i) => {
    const bandW = days.length <= 1 ? innerW : innerW / (days.length - 1);
    const band = el('rect', {
      x: xAt(i) - bandW / 2, y: padT, width: bandW, height: innerH,
      fill: 'transparent', style: 'cursor:crosshair'
    });
    band.addEventListener('mouseenter', () => {
      if (!tip) return;
      const dt = d.date;
      tip.innerHTML = `<b>${dt.getMonth() + 1}/${dt.getDate()}</b><br>`
        + `新增 ${d.created}　完成 ${d.completed}　处理中 ${d.progress}`;
      tip.classList.add('show');
      const tw = tip.offsetWidth || 150;
      let left = xAt(i) - tw / 2;
      left = Math.max(0, Math.min(left, W - tw));
      tip.style.left = left + 'px';
      tip.style.top = '6px';
    });
    band.addEventListener('mouseleave', () => { if (tip) tip.classList.remove('show'); });
    svg.appendChild(band);
  });
}

// CSV 单元格转义：把内部双引号转义为两个双引号，并整体用双引号包裹。
// 这样描述里的逗号、双引号、换行都能被 Excel 正确解析（换行按标准 CSV 保留）。
function csvCell(v) {
  const s = (v == null ? '' : String(v));
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportStatsCSV() {
  const { startVal, endVal, counts, list } = computeStats();
  const details = list.map(t => ({
    id: t.id,
    title: t.title,
    description: t.description || '',
    status: STATUS_LABELS[t.status],
    source: t.source,
    createdAt: formatTime(t.createdAt),
    startedAt: t.startedAt ? formatTime(t.startedAt) : '',
    completedAt: t.completedAt ? formatTime(t.completedAt) : '',
    cancelledAt: t.cancelledAt ? formatTime(t.cancelledAt) : '',
    updatedAt: formatTime(t.updatedAt),
    cancelReason: t.cancelReason || ''
  }));
  let csv = '\uFEFF'; // BOM for Excel
  csv += csvCell('统计时间段') + ',' + csvCell((startVal || '全部') + ' ~ ' + (endVal || '全部')) + '\n';
  csv += csvCell('统计口径') + ',' + csvCell('待处理/处理中=当前存量；已完成=按完成时间；已取消=按取消时间') + '\n\n';
  csv += csvCell('状态') + ',' + csvCell('数量') + '\n';
  csv += csvCell('待处理') + ',' + csvCell(counts.pending) + '\n';
  csv += csvCell('处理中') + ',' + csvCell(counts.processing) + '\n';
  csv += csvCell('已完成') + ',' + csvCell(counts.completed) + '\n';
  csv += csvCell('已取消') + ',' + csvCell(counts.cancelled) + '\n';
  csv += '\n' + csvCell('任务明细') + '\n';
  csv += ['任务编号', '标题', '任务描述', '状态', '客户来源', '创建时间', '启动时间', '完成时间', '取消时间', '最后更新', '取消原因'].map(csvCell).join(',') + '\n';
  details.forEach(d => {
    csv += [d.id, d.title, d.description, d.status, d.source, d.createdAt,
            d.startedAt, d.completedAt, d.cancelledAt, d.updatedAt, d.cancelReason].map(csvCell).join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `任务统计_${startVal || '全部'}_${endVal || '全部'}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
//  AI 工作汇报（配置与入口）
//  汇报展示页为独立页面 report.html，在新标签页打开
// ============================================================
const DEEPSEEK_ENDPOINT = 'https://api.deepseek.com/chat/completions';
const REPORT_PAYLOAD_KEY = 'report_payload';   // 通过同源 localStorage 传给 report.html

// ---- API Key / 模型存储 ----
// 权威数据存在 Supabase 的 user_settings 表（账号级，RLS 隔离，换设备自动同步）；
// 同时在 localStorage 留一份缓存，用于页面加载瞬间即可用、以及离线兜底。
let aiConfig = { key: '', model: 'deepseek-flash' };

function aiKeyStorageName() {
  const uid = (currentUser && currentUser.id) ? currentUser.id : 'anonymous';
  return 'ds_key_' + uid;
}
function aiModelStorageName() {
  const uid = (currentUser && currentUser.id) ? currentUser.id : 'anonymous';
  return 'ds_model_' + uid;
}

function getAiKey() { return aiConfig.key || ''; }
function getAiModel() { return aiConfig.model || 'deepseek-flash'; }

// 写入本地缓存（不含云端）
function cacheAiSettingsLocal(key, model) {
  try {
    if (key) localStorage.setItem(aiKeyStorageName(), key);
    else localStorage.removeItem(aiKeyStorageName());
    localStorage.setItem(aiModelStorageName(), model || 'deepseek-flash');
  } catch (e) { console.error('写入本地缓存失败:', e.message); }
}

// 登录后加载：先用本地缓存即时生效，再从 Supabase 拉取云端（以云端为准）
async function loadAiSettings() {
  aiConfig.key = '';
  aiConfig.model = 'deepseek-flash';
  try {
    aiConfig.key = localStorage.getItem(aiKeyStorageName()) || '';
    aiConfig.model = localStorage.getItem(aiModelStorageName()) || 'deepseek-flash';
  } catch (e) {}
  refreshAiSettingsBtn();

  if (!currentUser) return;
  const { data, error } = await sb
    .from('user_settings')
    .select('deepseek_key, model')
    .eq('user_id', currentUser.id)
    .maybeSingle();
  if (error) {
    console.error('读取云端 AI 设置失败:', error.message);
    return;
  }
  if (data) {
    aiConfig.key = data.deepseek_key || '';
    aiConfig.model = data.model || 'deepseek-flash';
    cacheAiSettingsLocal(aiConfig.key, aiConfig.model);
  } else {
    // 云端还没有记录：若本地已有配置，则顺带上传一次（便于老用户迁移）
    if (aiConfig.key) {
      await sb.from('user_settings').upsert({
        user_id: currentUser.id,
        deepseek_key: aiConfig.key,
        model: aiConfig.model,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
    }
  }
  refreshAiSettingsBtn();
}

// 更新顶部「AI 设置」按钮状态（已配置则高亮）
function refreshAiSettingsBtn() {
  const btn = document.getElementById('aiSettingsBtn');
  if (!btn) return;
  btn.classList.toggle('configured', Boolean(getAiKey()));
}

// ---- AI 设置弹窗 ----
function openAiSettings() {
  document.getElementById('aiApiKey').value = getAiKey();
  document.getElementById('aiModel').value = getAiModel();
  const st = document.getElementById('aiStatus');
  st.className = 'ai-status';
  st.textContent = '';
  openModal('modalAiSettings');
}

function showAiStatus(msg, kind) {
  const st = document.getElementById('aiStatus');
  st.textContent = msg;
  st.className = 'ai-status show ' + (kind || 'info');
}

// 测试连接：发一条最小请求验证 Key
async function testAiConnection() {
  const key = document.getElementById('aiApiKey').value.trim();
  const model = document.getElementById('aiModel').value;
  if (!key) { showAiStatus('请先填写 API Key', 'err'); return; }
  const btn = document.getElementById('aiTestBtn');
  btn.disabled = true;
  showAiStatus('正在测试连接…', 'info');
  try {
    const res = await fetch(DEEPSEEK_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: model,
        messages: [{ role: 'user', content: 'ping' }],
        stream: false,
        thinking: { type: 'disabled' },
        max_tokens: 5
      })
    });
    if (!res.ok) {
      const t = await res.text();
      showAiStatus('连接失败（' + res.status + '）：' + t.slice(0, 180), 'err');
    } else {
      showAiStatus('✅ 连接成功，Key 可用', 'ok');
    }
  } catch (e) {
    showAiStatus('网络错误：' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

// 保存：写入内存 + 本地缓存 + 云端（账号级）
async function saveAiSettings() {
  const key = document.getElementById('aiApiKey').value.trim();
  const model = document.getElementById('aiModel').value;
  const btn = document.getElementById('aiSaveBtn');
  btn.disabled = true;
  showAiStatus('正在保存到云端…', 'info');

  aiConfig.key = key;
  aiConfig.model = model;
  cacheAiSettingsLocal(key, model);
  refreshAiSettingsBtn();

  try {
    const { error } = await sb.from('user_settings').upsert({
      user_id: currentUser.id,
      deepseek_key: key,
      model: model,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
    if (error) {
      showAiStatus('已保存到本机，但云端保存失败：' + error.message + '（换设备可能不同步）', 'err');
      btn.disabled = false;
      return;
    }
    showAiStatus('✅ 已保存到账号，换设备登录后可自动同步', 'ok');
    setTimeout(() => closeModal('modalAiSettings'), 700);
  } catch (e) {
    showAiStatus('已保存到本机，但云端保存异常：' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

// 清除：内存 + 本地缓存 + 云端
async function clearAiKey() {
  const btn = document.getElementById('aiClearBtn');
  btn.disabled = true;
  aiConfig.key = '';
  cacheAiSettingsLocal('', getAiModel());
  document.getElementById('aiApiKey').value = '';
  refreshAiSettingsBtn();
  try {
    await sb.from('user_settings').upsert({
      user_id: currentUser.id,
      deepseek_key: '',
      model: getAiModel(),
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
    showAiStatus('已清除账号中保存的 API Key', 'info');
  } catch (e) {
    showAiStatus('本机已清除，但云端清除失败：' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

// ---- 收集当前统计区间的任务数据（口径与统计面板一致） ----
function collectReportData() {
  return computeStats();
}

// ---- 点击「AI 整理汇报」：写入数据并在新标签页打开 report.html ----
function onAiReportClick() {
  if (!getAiKey()) {
    alert('请先配置 DeepSeek API Key（右上角「⚙️ AI 设置」）');
    openAiSettings();
    return;
  }
  const data = collectReportData();
  if (data.list.length === 0) {
    alert('当前统计区间内没有任务，无法生成汇报。请调整查询周期。');
    return;
  }
  const payload = {
    uid: (currentUser && currentUser.id) ? currentUser.id : 'anonymous',
    startVal: data.startVal,
    endVal: data.endVal,
    counts: data.counts,
    list: data.list,
    ts: Date.now()
  };
  try {
    localStorage.setItem(REPORT_PAYLOAD_KEY, JSON.stringify(payload));
  } catch (e) {
    alert('写入任务数据失败：' + e.message);
    return;
  }
  const w = window.open('report.html', '_blank');
  if (!w) alert('新标签页被浏览器拦截，请允许本站弹出窗口后重试。');
}


// ============================================================
//  EVENT LISTENERS

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginPass').focus(); });
  // Register / mode switch
  const gotoRegister = document.getElementById('gotoRegister');
  const gotoLogin = document.getElementById('gotoLogin');
  if (gotoRegister) gotoRegister.addEventListener('click', showRegisterMode);
  if (gotoLogin) gotoLogin.addEventListener('click', showLoginMode);
  const registerBtn = document.getElementById('registerBtn');
  if (registerBtn) registerBtn.addEventListener('click', doRegister);
  const regPass = document.getElementById('regPass');
  if (regPass) regPass.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
  // Logout
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  // 主题切换
  const themeBtn = document.getElementById('themeToggleBtn');
  if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

  // 搜索与筛选
  ['filterSearch', 'globalSearch'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', e => {
      const f = document.getElementById('filterSearch');
      if (f && f.value !== e.target.value) f.value = e.target.value;
      refreshViews();
    });
  });
  ['filterDept', 'filterAssignee', 'filterPriority', 'filterStatus'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', refreshViews);
  });

  // 列表模式：每页条数 + 列设置下拉
  const lvPs = document.getElementById('lvPageSize');
  if (lvPs) lvPs.addEventListener('change', () => {
    const v = Number(lvPs.value);
    listPageSize = ([20, 50, 100].indexOf(v) >= 0) ? v : 20;
    listPage = 1;
    saveListPrefs();
    renderList();
  });
  const lvCb = document.getElementById('lvColsBtn');
  const lvCm = document.getElementById('lvColsMenu');
  if (lvCb && lvCm) lvCb.addEventListener('click', e => {
    e.stopPropagation();
    lvCm.classList.toggle('show');
  });

  // 用户下拉菜单
  const userTrigger = document.getElementById('userTrigger');
  const userDropdown = document.getElementById('userDropdown');
  if (userTrigger && userDropdown) {
    userTrigger.addEventListener('click', e => {
      e.stopPropagation();
      userDropdown.classList.toggle('show');
      if (typeof closeCardMenus === 'function') closeCardMenus();
    });
  }
  const bindClick = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
  bindClick('ddAiSettings', () => { if (userDropdown) userDropdown.classList.remove('show'); openAiSettings(); });
  bindClick('ddTheme', () => { if (userDropdown) userDropdown.classList.remove('show'); toggleTheme(); });
  bindClick('ddExport', () => { if (userDropdown) userDropdown.classList.remove('show'); exportStatsCSV(); });

  // 看板 / 列表 视图切换
  const vb = document.getElementById('viewBoardBtn');
  const vl = document.getElementById('viewListBtn');
  if (vb) vb.addEventListener('click', () => setView('board'));
  if (vl) vl.addEventListener('click', () => setView('list'));

  // 已完成列：查看全部 / 收起
  // 趋势图独立周期
  const tr = document.getElementById('trendRange');
  if (tr) tr.addEventListener('change', renderTrendChart);

  // 日期范围变化即刷新（已移除「查询」按钮）
  ['statsStart', 'statsEnd'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => { clearQuickRangeActive(); renderStats(); });
  });

  // 任务详情 Drawer：关闭按钮 + Esc
  const dClose = document.getElementById('drawerClose');
  if (dClose) dClose.addEventListener('click', closeTaskDrawer);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeTaskDrawer();
  });

  const sac = document.getElementById('showAllCompleted');
  if (sac) sac.addEventListener('click', toggleShowAllCompleted);

  // 点击空白处关闭下拉与卡片菜单
  document.addEventListener('click', () => {
    if (userDropdown) userDropdown.classList.remove('show');
    if (typeof closeCardMenus === 'function') closeCardMenus();
    const lvCm = document.getElementById('lvColsMenu');
    if (lvCm) lvCm.classList.remove('show');
  });
  // AI 设置与汇报（汇报展示在独立页面 report.html）
  document.getElementById('aiSettingsBtn').addEventListener('click', openAiSettings);
  document.getElementById('aiSaveBtn').addEventListener('click', saveAiSettings);
  document.getElementById('aiTestBtn').addEventListener('click', testAiConnection);
  document.getElementById('aiClearBtn').addEventListener('click', clearAiKey);
  document.getElementById('aiReportBtn').addEventListener('click', onAiReportClick);

      const el = document.getElementById(id);
      if (el) el.value = '';
    });

    setTimeout(() => document.getElementById('newTaskTitle').focus(), 100);
  });
  document.getElementById('confirmNewTask').addEventListener('click', () => {
    const title = document.getElementById('newTaskTitle').value.trim();
    if (!title) {
      document.getElementById('newTaskTitle').style.borderColor = 'var(--danger)';
      document.getElementById('newTaskTitle').placeholder = '请输入任务名称（必填）';
      return;
    }
    const desc = document.getElementById('newTaskDesc').value.trim();
    const source = document.getElementById('newTaskSource').value.trim();
    const tagsRaw = document.getElementById('newTaskTags').value.trim();
    createTask(title, desc, source, {
      priority: document.getElementById('newTaskPriority').value || 'P2',
      assignee: document.getElementById('newTaskAssignee').value,
      department: document.getElementById('newTaskDept').value,
      dueDate: document.getElementById('newTaskDue').value || '',
      tags: tagsRaw ? tagsRaw.split(/[,，]/).map(s => s.trim()).filter(Boolean) : []
    });
    closeModal('modalNewTask');
  });
  document.getElementById('newTaskTitle').addEventListener('input', () => {
    document.getElementById('newTaskTitle').style.borderColor = '';
  });
  document.getElementById('newTaskTitle').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('newTaskDesc').focus();
  });
  // Cancel reason
  document.getElementById('confirmCancel').addEventListener('click', doConfirmCancel);
  document.getElementById('cancelReasonInput').addEventListener('input', () => {
    document.getElementById('cancelReasonInput').style.borderColor = '';
  });
  // Statistics
  document.getElementById('statsExport').addEventListener('click', exportStatsCSV);
  // 快捷周期按钮：点击后立即刷新统计
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => setQuickRange(btn.dataset.range));
  });
  // 手动修改日期时，取消快捷按钮的激活态（表示自定义区间）
  ['statsStart', 'statsEnd'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', clearQuickRangeActive);
  });
  // Close modals on overlay click
  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target === el) closeModal(el.id);
    });
  });
  // Keyboard: Escape to close modal
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.show').forEach(el => closeModal(el.id));
    }
  });
}
