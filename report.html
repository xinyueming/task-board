<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工作汇报</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 40%, #16213e 100%);
  min-height: 100vh; color: #e0e0e0;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

.page { max-width: 1080px; margin: 0 auto; padding: 24px 24px 48px; }

/* 顶部栏 */
.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 14px 20px; margin-bottom: 20px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
}
.btn-back, .btn-regen {
  padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.btn-back { border: 1px solid rgba(255,255,255,0.15); background: transparent; color: rgba(255,255,255,0.75); }
.btn-back:hover { background: rgba(255,255,255,0.08); }
.btn-regen { border: 1px solid rgba(102,126,234,0.5); background: rgba(102,126,234,0.12); color: #9aa8f0; }
.btn-regen:hover { background: rgba(102,126,234,0.25); }
.btn-regen:disabled { opacity: 0.45; cursor: not-allowed; }
.topbar .title { font-size: 16px; font-weight: 600; color: #e8e8e8; }
.topbar .range { font-size: 13px; color: rgba(255,255,255,0.45); margin-left: auto; }

/* 汇报正文 */
.report-doc {
  background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 40px 44px; margin-bottom: 20px; color: #e0e0e0;
}
.report-doc h1 {
  font-size: 24px; font-weight: 700; margin-bottom: 26px; padding-bottom: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.report-section { margin-bottom: 26px; }
.report-section h2 {
  font-size: 16px; font-weight: 600; color: #a9b6ff; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.report-section h2::before {
  content: ''; width: 4px; height: 16px; border-radius: 2px;
  background: linear-gradient(180deg, #667eea, #764ba2);
}
.report-section p { font-size: 14px; line-height: 1.85; color: #cfcfd8; text-align: justify; }
.report-section ul { list-style: none; padding: 0; }
.report-section li {
  font-size: 14px; line-height: 1.85; color: #cfcfd8; padding-left: 20px;
  position: relative; margin-bottom: 8px; text-align: justify;
}
.report-section li::before { content: '•'; position: absolute; left: 4px; color: #7c8cf0; font-weight: 700; }
.placeholder { color: rgba(255,255,255,0.3); font-size: 14px; text-align: center; padding: 60px 0; }

.loading { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.5); font-size: 13px; }
.spinner {
  width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.15);
  border-top-color: #7c8cf0; border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.err-text { color: #ff8080; }

/* 对话窗口 */
.chat-box {
  background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; overflow: hidden; margin-bottom: 20px;
}
.chat-header {
  padding: 14px 20px; font-size: 14px; font-weight: 600; color: #a9b6ff;
  background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; gap: 8px;
}
.chat-header .hint { font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.35); }
.chat-log { max-height: 340px; overflow-y: auto; padding: 16px 20px; }
.chat-log:empty { display: none; }
.chat-msg { margin-bottom: 14px; display: flex; gap: 10px; }
.chat-msg .who {
  flex: none; width: 30px; height: 30px; border-radius: 50%; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.chat-msg.user .who { background: rgba(102,126,234,0.25); color: #9aa8f0; }
.chat-msg.ai .who { background: rgba(219,39,119,0.22); color: #f0a0c8; }
.chat-msg .bubble {
  flex: 1; font-size: 13.5px; line-height: 1.7; color: #cfcfd8;
  background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 14px;
  white-space: pre-wrap; word-break: break-word;
}
.chat-msg.user .bubble { background: rgba(102,126,234,0.12); color: #dfe3ff; }
.chat-input-row { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.06); }
.chat-input-row textarea {
  flex: 1; min-height: 52px; max-height: 140px; resize: vertical;
  padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; outline: none;
  font-family: inherit; line-height: 1.5;
}
.chat-input-row textarea:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
.chat-input-row textarea::placeholder { color: rgba(255,255,255,0.25); }
.btn-send {
  flex: none; padding: 0 26px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: transform 0.2s;
}
.btn-send:hover:not(:disabled) { transform: translateY(-1px); }
.btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

/* 导出栏 */
.actions {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 16px 20px; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
  position: sticky; bottom: 16px; backdrop-filter: blur(12px);
}
.actions .label { font-size: 13px; color: rgba(255,255,255,0.45); }
.btn-export {
  padding: 9px 20px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
  background: rgba(255,255,255,0.05); color: #e0e0e0; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
}
.btn-export:hover:not(:disabled) { background: rgba(102,126,234,0.2); border-color: rgba(102,126,234,0.5); }
.btn-export:disabled { opacity: 0.4; cursor: not-allowed; }

/* 打印样式（高清打印版） */
@media print {
  body { background: #fff !important; }
  .topbar, .chat-box, .actions { display: none !important; }
  .page { max-width: none !important; padding: 0 !important; }
  .report-doc {
    background: #fff !important; border: none !important; border-radius: 0 !important;
    padding: 0 !important; color: #000 !important; margin: 0 !important;
  }
  .report-doc h1 {
    -webkit-text-fill-color: #1a1a3e !important; color: #1a1a3e !important;
    background: none !important; border-bottom: 2px solid #333 !important;
  }
  .report-section h2 { color: #333 !important; }
  .report-section h2::before { background: #333 !important; }
  .report-section p, .report-section li { color: #000 !important; }
  .report-section li::before { color: #333 !important; }
}
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <button class="btn-back" id="backBtn">← 返回看板</button>
    <span class="title">📄 AI 工作汇报</span>
    <span class="range" id="rangeInfo"></span>
    <button class="btn-regen" id="regenBtn">重新生成</button>
  </div>

  <div class="report-doc" id="reportDoc">
    <div class="placeholder" id="placeholder">正在读取任务数据…</div>
  </div>

  <!-- 对话窗口：可在生成内容基础上继续提要求 -->
  <div class="chat-box">
    <div class="chat-header">
      💬 继续调整
      <span class="hint">对 AI 提要求，例如"重点进展写详细些""语气更正式""补充风险分析"</span>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="输入修改要求，Enter 发送 / Shift+Enter 换行"></textarea>
      <button class="btn-send" id="chatSend">发送</button>
    </div>
  </div>

  <div class="actions">
    <span class="label">导出：</span>
    <button class="btn-export" id="exportWordBtn" disabled>📘 Word</button>
    <button class="btn-export" id="exportPdfBtn" disabled>📕 PDF</button>
    <button class="btn-export" id="exportPrintBtn" disabled>🖨 高清打印版</button>
    <button class="btn-export" id="exportPptBtn" disabled>📙 PPT</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
// ============================================================
//  AI 工作汇报（独立页面）
// ============================================================
const DEEPSEEK_ENDPOINT = 'https://api.deepseek.com/chat/completions';
const PAYLOAD_KEY = 'report_payload';   // 由 index.html 写入（同源 localStorage 共享）

const STATUS_LABELS = { pending: '待处理', processing: '处理中', completed: '已完成', cancelled: '已取消' };

const REPORT_SYSTEM_PROMPT = [
  '你是一名专业的职场助理，擅长把零散的任务数据整理成结构清晰、重点突出、可直接向上级汇报的中文工作汇报。',
  '',
  '要求：',
  '1. 语言正式、简洁，用第三人称陈述，避免口语化表达',
  '2. 突出成果与进展，尽量量化（完成数量、完成率、关键指标）',
  '3. 客观说明问题与风险，对已取消任务归纳原因',
  '4. 给出切实可行的下阶段计划建议',
  '5. 严格只输出以下 JSON 结构，不要输出任何多余文字或代码块标记：',
  '{"标题":"","概述":"","完成情况":[""],"重点进展":[""],"问题与风险":[""],"下阶段计划":[""]}'
].join('\n');

let payload = null;      // { uid, startVal, endVal, counts, list, model }
let reportData = null;   // 最近一次规范化的汇报内容
let conversation = [];   // 多轮对话消息（用于继续调整）
let busy = false;

// ---- 工具 ----
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = (s == null ? '' : String(s));
  return d.innerHTML;
}
function fileStamp() {
  const n = new Date();
  return n.getFullYear() + String(n.getMonth() + 1).padStart(2, '0') + String(n.getDate()).padStart(2, '0');
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function getAiKey() {
  if (!payload) return '';
  try { return localStorage.getItem('ds_key_' + payload.uid) || ''; } catch (e) { return ''; }
}
function getAiModel() {
  if (!payload) return 'deepseek-flash';
  try { return localStorage.getItem('ds_model_' + payload.uid) || 'deepseek-flash'; } catch (e) { return 'deepseek-flash'; }
}

// ---- 渲染汇报 ----
function renderReport(r) {
  const sec = (title, items) => {
    if (!items || !items.length) return '';
    return '<div class="report-section"><h2>' + escHtml(title) + '</h2><ul>'
      + items.map(i => '<li>' + escHtml(i) + '</li>').join('') + '</ul></div>';
  };
  let html = '<h1>' + escHtml(r.title) + '</h1>';
  if (r.summary) html += '<div class="report-section"><h2>概述</h2><p>' + escHtml(r.summary) + '</p></div>';
  html += sec('完成情况', r.done);
  html += sec('重点进展', r.progress);
  html += sec('问题与风险', r.risks);
  html += sec('下阶段计划', r.plan);
  document.getElementById('reportDoc').innerHTML = html;
}

function normalizeReport(raw) {
  const arr = v => {
    if (Array.isArray(v)) return v.map(x => String(x)).filter(x => x.trim());
    if (typeof v === 'string' && v.trim()) return [v];
    return [];
  };
  const str = v => (v == null ? '' : String(v));
  return {
    title: str(raw['标题'] || raw.title) || '工作汇报',
    summary: str(raw['概述'] || raw.summary),
    done: arr(raw['完成情况'] || raw.done),
    progress: arr(raw['重点进展'] || raw.progress),
    risks: arr(raw['问题与风险'] || raw.risks),
    plan: arr(raw['下阶段计划'] || raw.plan)
  };
}

// ---- 对话日志 ----
function addChatMsg(role, text) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'chat-msg ' + (role === 'user' ? 'user' : 'ai');
  div.innerHTML = '<div class="who">' + (role === 'user' ? '我' : 'AI') + '</div>'
    + '<div class="bubble">' + escHtml(text) + '</div>';
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ---- 初始任务数据文本 ----
function buildInitialPrompt(d) {
  const lines = [];
  lines.push('统计区间：' + (d.startVal || '全部') + ' ~ ' + (d.endVal || '全部'));
  lines.push('统计口径说明：待处理、处理中为「当前存量」（不局限于统计区间）；'
    + '已完成为「统计区间内完成」的任务；已取消为「统计区间内取消」的任务。撰写时请按此口径表述。');
  lines.push('状态汇总：待处理' + d.counts.pending + '（当前存量），处理中' + d.counts.processing
    + '（当前存量），已完成' + d.counts.completed + '（区间内完成），已取消' + d.counts.cancelled
    + '（区间内取消）（共' + d.list.length + '项）');
  lines.push('');
  lines.push('任务明细（含各阶段时间）：');
  d.list.forEach(t => {
    let s = '- ' + t.id + ' ' + t.title + ' [' + (STATUS_LABELS[t.status] || t.status) + ']';
    s += ' 来源:' + (t.source || '未指定');
    if (t.description) s += ' 描述:' + t.description;
    if (t.createdAt) s += ' 创建:' + fmtShort(t.createdAt);
    if (t.startedAt) s += ' 启动:' + fmtShort(t.startedAt);
    if (t.completedAt) s += ' 完成:' + fmtShort(t.completedAt);
    if (t.cancelledAt) s += ' 取消:' + fmtShort(t.cancelledAt);
    if (t.status === 'cancelled' && t.cancelReason) s += ' 取消原因:' + t.cancelReason;
    lines.push(s);
  });
  return lines.join('\n');
}

// 提示词里的短时间格式
function fmtShort(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  const h = String(dt.getHours()).padStart(2, '0');
  const mi = String(dt.getMinutes()).padStart(2, '0');
  return `${m}-${day} ${h}:${mi}`;
}

// ---- 调用 DeepSeek（流式） ----
async function callDeepSeek(messages, onProgress) {
  const key = getAiKey();
  if (!key) throw new Error('未配置 API Key，请回到看板页面在「⚙️ AI 设置」中配置');

  const res = await fetch(DEEPSEEK_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({
      model: getAiModel(),
      messages: messages,
      stream: true,
      thinking: { type: 'disabled' },
      response_format: { type: 'json_object' },
      max_tokens: 4096
    })
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error('接口返回 ' + res.status + '：' + t.slice(0, 200));
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let sseBuf = '', buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    sseBuf += decoder.decode(value, { stream: true });
    const parts = sseBuf.split('\n');
    sseBuf = parts.pop();
    for (const line of parts) {
      const l = line.trim();
      if (!l.startsWith('data:')) continue;
      const pl = l.slice(5).trim();
      if (pl === '[DONE]') continue;
      try {
        const o = JSON.parse(pl);
        const delta = o.choices && o.choices[0] && o.choices[0].delta;
        if (delta && delta.content) { buffer += delta.content; if (onProgress) onProgress(buffer.length); }
      } catch (e) { /* 忽略不完整分片 */ }
    }
  }

  // 解析 JSON（含兜底）
  let parsed = null;
  try { parsed = JSON.parse(buffer); } catch (e) {
    const a = buffer.indexOf('{'), b = buffer.lastIndexOf('}');
    if (a !== -1 && b > a) { try { parsed = JSON.parse(buffer.slice(a, b + 1)); } catch (e2) { parsed = null; } }
  }
  return { parsed, raw: buffer };
}

function setExportEnabled(on) {
  ['exportWordBtn', 'exportPdfBtn', 'exportPrintBtn', 'exportPptBtn'].forEach(id => {
    document.getElementById(id).disabled = !on;
  });
}

// ---- 生成（首轮） ----
async function generateInitial() {
  if (busy || !payload) return;
  busy = true;
  setExportEnabled(false);
  document.getElementById('regenBtn').disabled = true;
  document.getElementById('chatSend').disabled = true;

  conversation = [
    { role: 'system', content: REPORT_SYSTEM_PROMPT },
    { role: 'user', content: buildInitialPrompt(payload) }
  ];

  const doc = document.getElementById('reportDoc');
  doc.innerHTML = '<div class="loading"><div class="spinner"></div><span id="genHint">AI 正在分析任务数据并生成汇报…</span></div>';

  try {
    const { parsed, raw } = await callDeepSeek(conversation, (n) => {
      const h = document.getElementById('genHint');
      if (h) h.textContent = 'AI 正在生成中…（已接收 ' + n + ' 字）';
    });
    if (!parsed) {
      doc.innerHTML = '<h1>AI 工作汇报</h1><div class="report-section"><p>'
        + escHtml(raw).replace(/\n/g, '<br>') + '</p></div>';
      setExportEnabled(false);
      addChatMsg('ai', '本次输出不是结构化 JSON，已按纯文本展示。你可以继续提要求让 AI 重新整理。');
    } else {
      reportData = normalizeReport(parsed);
      conversation.push({ role: 'assistant', content: JSON.stringify(parsed) });
      renderReport(reportData);
      setExportEnabled(true);
    }
  } catch (e) {
    doc.innerHTML = '<div class="report-section"><h2>生成失败</h2><p class="err-text">'
      + escHtml(e.message || String(e)) + '</p><p style="font-size:13px;color:rgba(255,255,255,0.4)">'
      + '请检查：API Key 是否有效、账户余额是否充足、网络是否可访问 api.deepseek.com。</p></div>';
  } finally {
    busy = false;
    document.getElementById('regenBtn').disabled = false;
    document.getElementById('chatSend').disabled = false;
  }
}

// ---- 继续调整（对话重生成） ----
async function sendRefinement() {
  if (busy || !payload) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  if (conversation.length === 0) {
    alert('请先生成一次汇报');
    return;
  }

  busy = true;
  input.value = '';
  document.getElementById('chatSend').disabled = true;
  document.getElementById('regenBtn').disabled = true;
  addChatMsg('user', text);
  conversation.push({ role: 'user', content: text });

  const doc = document.getElementById('reportDoc');
  const prev = doc.innerHTML;
  doc.innerHTML = '<div class="loading"><div class="spinner"></div><span id="genHint">AI 正在按你的要求调整…</span></div>';

  try {
    const { parsed, raw } = await callDeepSeek(conversation, (n) => {
      const h = document.getElementById('genHint');
      if (h) h.textContent = 'AI 正在调整中…（已接收 ' + n + ' 字）';
    });
    if (!parsed) {
      doc.innerHTML = prev;
      addChatMsg('ai', '调整失败：模型未返回有效结构，已保留上一版内容。可换个说法重试。');
    } else {
      reportData = normalizeReport(parsed);
      conversation.push({ role: 'assistant', content: JSON.stringify(parsed) });
      renderReport(reportData);
      setExportEnabled(true);
      addChatMsg('ai', '已按你的要求更新汇报内容。');
    }
  } catch (e) {
    doc.innerHTML = prev;
    addChatMsg('ai', '调整失败：' + (e.message || String(e)));
  } finally {
    busy = false;
    document.getElementById('chatSend').disabled = false;
    document.getElementById('regenBtn').disabled = false;
    input.focus();
  }
}

// ============================================================
//  导出
// ============================================================
// Word 专业版导出
// 依据 anthropics/skills@docx 规范：
//  · 表格需同时设 columnWidths 与每个 cell 的 width（DXA）
//  · 表格底纹必须用 ShadingType.CLEAR（SOLID 会渲染成黑色）
//  · PageBreak 必须放在 Paragraph 内
//  · 目录标题必须使用内置 HeadingLevel，并设 updateFields 才会自动更新
//  · 不使用字面量「•」，项目符号交由 numbering 处理
async function exportWord() {
  if (!reportData) return;
  const d = reportData;
  const D = window.docx;
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell,
          WidthType, ShadingType, BorderStyle, AlignmentType, PageNumber, PageBreak,
          Header, Footer, TableOfContents } = D;

  const FONT   = '微软雅黑';
  const NAVY   = '1E2761';
  const INK    = '1A1A1A';
  const MUTED  = '808080';
  const ZEBRA  = 'F2F5FA';
  const SZ_BODY = 21;   // 10.5pt 五号
  const SZ_SUB  = 24;   // 12pt
  const SZ_H    = 32;   // 16pt
  const SZ_TITLE= 52;   // 26pt
  const TABLE_W = 9000;
  const COL_W = [3600, 2700, 2700];

  const txt = (text, o = {}) => new TextRun({
    text, font: FONT, size: o.size || SZ_BODY, bold: !!o.bold,
    color: o.color || INK, italics: !!o.italics
  });

  // 单元格（同时设置 width 与可选底纹）
  const cell = (text, o = {}) => new TableCell({
    width: { size: o.w, type: WidthType.DXA },
    ...(o.fill ? { shading: { type: ShadingType.CLEAR, fill: o.fill, color: 'auto' } } : {}),
    margins: { top: 90, bottom: 90, left: 150, right: 150 },
    children: [new Paragraph({
      alignment: o.align || AlignmentType.LEFT,
      children: [txt(text, { bold: o.bold, color: o.color, size: o.size })]
    })]
  });

  // 章节标题（用内置 Heading 以便进入目录）
  const sectionHeading = (text) => new Paragraph({
    heading: HeadingLevel.HEADING_1,
    spacing: { before: 320, after: 160 },
    children: [txt(text, { size: SZ_H, bold: true, color: NAVY })]
  });

  const bodyPara = (text) => new Paragraph({
    spacing: { after: 140, line: 340 },
    children: [txt(text)]
  });

  const bullet = (text) => new Paragraph({
    bullet: { level: 0 },
    spacing: { after: 100, line: 340 },
    children: [txt(text)]
  });

  const CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  let idx = 0;
  const num = () => CN[idx++] || String(idx);

  const children = [];

  // ---------- 封面页 ----------
  children.push(new Paragraph({ spacing: { before: 2600 }, children: [] }));
  children.push(new Paragraph({
    alignment: AlignmentType.CENTER, spacing: { after: 400 },
    children: [txt(d.title, { size: SZ_TITLE, bold: true, color: NAVY })]
  }));
  children.push(new Paragraph({
    alignment: AlignmentType.CENTER, spacing: { after: 140 },
    children: [txt('统计区间：' + (payload.startVal || '全部') + ' ~ ' + (payload.endVal || '全部'), { size: SZ_SUB, color: MUTED })]
  }));
  children.push(new Paragraph({
    alignment: AlignmentType.CENTER, spacing: { after: 140 },
    children: [txt('任务总数：' + payload.list.length + ' 项', { size: SZ_SUB, color: MUTED })]
  }));
  children.push(new Paragraph({
    alignment: AlignmentType.CENTER,
    children: [txt('生成日期：' + wordToday(), { size: SZ_SUB, color: MUTED })]
  }));
  children.push(new Paragraph({ children: [new PageBreak()] }));

  // ---------- 目录 ----------
  children.push(new Paragraph({
    spacing: { after: 220 },
    children: [txt('目　录', { size: SZ_H, bold: true, color: NAVY })]
  }));
  children.push(new TableOfContents('目录', { hyperlink: true, headingStyleRange: '1-2' }));
  children.push(new Paragraph({ children: [new PageBreak()] }));

  // ---------- 正文 ----------
  if (d.summary) {
    children.push(sectionHeading(num() + '、概述'));
    children.push(bodyPara(d.summary));
  }

  // 数据汇总表
  children.push(sectionHeading(num() + '、数据汇总'));
  const c = (payload.counts || {});
  const rowsCounts = [
    ['待处理', c.pending || 0],
    ['处理中', c.processing || 0],
    ['已完成', c.completed || 0],
    ['已取消', c.cancelled || 0]
  ];
  const totalForPct = payload.list.length || 1;
  const tableRows = [
    new TableRow({
      tableHeader: true,
      children: [
        cell('状态', { w: COL_W[0], bold: true, fill: NAVY, color: 'FFFFFF', align: AlignmentType.CENTER }),
        cell('数量', { w: COL_W[1], bold: true, fill: NAVY, color: 'FFFFFF', align: AlignmentType.CENTER }),
        cell('占比', { w: COL_W[2], bold: true, fill: NAVY, color: 'FFFFFF', align: AlignmentType.CENTER })
      ]
    })
  ];
  rowsCounts.forEach(([label, n], i) => {
    const fill = i % 2 === 1 ? ZEBRA : undefined;
    const pct = totalForPct ? Math.round((n / totalForPct) * 100) + '%' : '0%';
    tableRows.push(new TableRow({
      children: [
        cell(label, { w: COL_W[0], fill }),
        cell(String(n), { w: COL_W[1], fill, align: AlignmentType.CENTER }),
        cell(pct, { w: COL_W[2], fill, align: AlignmentType.CENTER })
      ]
    }));
  });
  children.push(new Table({
    width: { size: TABLE_W, type: WidthType.DXA },
    columnWidths: COL_W,
    rows: tableRows
  }));
  children.push(new Paragraph({ spacing: { after: 120 }, children: [] }));

  // 各内容章节
  [['完成情况', d.done], ['重点进展', d.progress],
   ['问题与风险', d.risks], ['下阶段计划', d.plan]].forEach(([title, items]) => {
    if (!items || !items.length) return;
    children.push(sectionHeading(num() + '、' + title));
    items.forEach(it => children.push(bullet(it)));
  });

  // ---------- 页眉 / 页脚 ----------
  const header = new Header({
    children: [new Paragraph({
      alignment: AlignmentType.RIGHT,
      border: { bottom: { style: BorderStyle.SINGLE, size: 4, color: 'D9D9D9', space: 4 } },
      children: [txt('工作汇报', { size: 18, color: MUTED })]
    })]
  });
  const footer = new Footer({
    children: [new Paragraph({
      alignment: AlignmentType.CENTER,
      children: [
        txt('第 ', { size: 18, color: MUTED }),
        new TextRun({ children: [PageNumber.CURRENT], font: FONT, size: 18, color: MUTED }),
        txt(' 页 / 共 ', { size: 18, color: MUTED }),
        new TextRun({ children: [PageNumber.TOTAL_PAGES], font: FONT, size: 18, color: MUTED }),
        txt(' 页', { size: 18, color: MUTED })
      ]
    })]
  });

  const docx = new Document({
    features: { updateFields: true },   // 打开时自动更新目录页码
    styles: { default: { document: { run: { font: FONT, size: SZ_BODY, color: INK } } } },
    sections: [{
      properties: { page: { margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 } } },
      headers: { default: header },
      footers: { default: footer },
      children
    }]
  });
  const blob = await Packer.toBlob(docx);
  downloadBlob(blob, '工作汇报_' + fileStamp() + '.docx');
}

function wordToday() {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
}

// PPT 专业版导出（科技深色）
// 依据 anthropics/skills@pptx 规范：
//  · pres.layout 必须在 addSlide 之前设置（LAYOUT_16x9 = 10"×5.625"）
//  · 十六进制颜色不带 #、不用 8 位（否则文件损坏）
//  · 不复用同一个 options 对象（库会原地改写为 EMU）
//  · 项目符号用 bullet:true（不写字面 •），breakLine 只设在非末项
//  · 段落间距用 paraSpaceAfter，不要用 lineSpacing
//  · 每页都要有视觉元素；标题 36pt±；不用装饰性色条/下划线
async function exportPpt() {
  if (!reportData) return;
  const d = reportData;

  const BG    = '0B1020';   // 深色背景
  const CARD  = '151C33';   // 卡片底色
  const NAVY  = '1E2761';   // 主色
  const ICE   = 'CADCFC';   // 次色
  const MINT  = '02C39A';   // 强调色
  const WHITE = 'FFFFFF';
  const BODY  = 'C7D2E5';
  const MUTED = '8FA3C8';
  const FONT  = '微软雅黑';

  const pptx = new window.PptxGenJS();
  pptx.layout = 'LAYOUT_16x9';       // 10" × 5.625"

  const c = payload.counts || {};
  const total = payload.list.length || 1;
  const rangeText = (payload.startVal || '全部') + ' ~ ' + (payload.endVal || '全部');

  // 统一的深色背景 + 视觉母题（薄荷色圆点），供各页复用
  const paintBg = (s) => { s.background = { color: BG }; };
  const addDot = (s, x, y, size, color, transparency) => {
    s.addShape(pptx.ShapeType.ellipse, {
      x, y, w: size, h: size,
      fill: { color, transparency },
      line: { color, width: 0 }
    });
  };
  // 页码（手动绘制，避免依赖 slideNumber 选项）
  const addPager = (s, n) => {
    s.addText(String(n), { x: 9.2, y: 5.12, w: 0.5, h: 0.3, fontFace: FONT, fontSize: 10, color: MUTED, align: 'right', margin: 0 });
  };
  // 内容页标题 + 编号圆点
  const addHeading = (s, num, text) => {
    s.addShape(pptx.ShapeType.ellipse, { x: 0.5, y: 0.42, w: 0.42, h: 0.42, fill: { color: MINT }, line: { color: MINT, width: 0 } });
    s.addText(String(num), { x: 0.5, y: 0.42, w: 0.42, h: 0.42, fontFace: FONT, fontSize: 14, bold: true, color: '06251E', align: 'center', valign: 'middle', margin: 0 });
    s.addText(text, { x: 1.06, y: 0.36, w: 8.4, h: 0.56, fontFace: FONT, fontSize: 30, bold: true, color: WHITE, align: 'left', valign: 'middle', margin: 0 });
  };

  // ---------- 1. 封面 ----------
  const cover = pptx.addSlide();
  paintBg(cover);
  addDot(cover, 7.4, -1.1, 3.6, NAVY, 55);
  addDot(cover, 8.6, 3.5, 2.4, MINT, 78);
  addDot(cover, -1.0, 3.8, 2.8, NAVY, 62);
  cover.addText(d.title, {
    x: 0.7, y: 1.86, w: 8.6, h: 1.2, fontFace: FONT, fontSize: 40, bold: true,
    color: WHITE, align: 'center', valign: 'middle', margin: 0
  });
  cover.addText('统计区间：' + rangeText, {
    x: 0.7, y: 3.16, w: 8.6, h: 0.4, fontFace: FONT, fontSize: 14, color: ICE, align: 'center', margin: 0
  });
  cover.addText('任务总数 ' + payload.list.length + ' 项　·　AI 自动生成', {
    x: 0.7, y: 3.62, w: 8.6, h: 0.4, fontFace: FONT, fontSize: 12, color: MUTED, align: 'center', margin: 0
  });

  // ---------- 2. 目录 ----------
  const agendaItems = [];
  if (d.summary) agendaItems.push('概述');
  agendaItems.push('数据汇总');
  if (d.done && d.done.length) agendaItems.push('完成情况');
  if (d.progress && d.progress.length) agendaItems.push('重点进展');
  if (d.risks && d.risks.length) agendaItems.push('问题与风险');
  if (d.plan && d.plan.length) agendaItems.push('下阶段计划');

  const agenda = pptx.addSlide();
  paintBg(agenda);
  addDot(agenda, 8.9, -0.9, 2.8, NAVY, 62);
  agenda.addText('目录', { x: 0.5, y: 0.42, w: 9, h: 0.6, fontFace: FONT, fontSize: 30, bold: true, color: WHITE, margin: 0 });
  agendaItems.forEach((label, i) => {
    const y = 1.46 + i * 0.66;
    agenda.addShape(pptx.ShapeType.ellipse, { x: 0.72, y: y, w: 0.34, h: 0.34, fill: { color: MINT, transparency: i === 0 ? 0 : 25 }, line: { color: MINT, width: 0 } });
    agenda.addText(String(i + 1), { x: 0.72, y: y, w: 0.34, h: 0.34, fontFace: FONT, fontSize: 12, bold: true, color: '06251E', align: 'center', valign: 'middle', margin: 0 });
    agenda.addText(label, { x: 1.26, y: y - 0.03, w: 7.6, h: 0.4, fontFace: FONT, fontSize: 16, color: BODY, valign: 'middle', margin: 0 });
  });
  addPager(agenda, 2);

  // ---------- 3. 数据总览（大号数字） ----------
  const stats = pptx.addSlide();
  paintBg(stats);
  stats.addText('数据总览', { x: 0.5, y: 0.42, w: 9, h: 0.6, fontFace: FONT, fontSize: 30, bold: true, color: WHITE, margin: 0 });
  const cards = [
    ['待处理', c.pending || 0, ICE],
    ['处理中', c.processing || 0, MINT],
    ['已完成', c.completed || 0, '7BD88F'],
    ['已取消', c.cancelled || 0, MUTED]
  ];
  const cw = 2.1, gap = 0.2, cx0 = 0.5;
  cards.forEach(([label, val, accent], i) => {
    const x = cx0 + i * (cw + gap);
    stats.addShape(pptx.ShapeType.roundRect, {
      x, y: 1.62, w: cw, h: 2.15, rectRadius: 0.1,
      fill: { color: CARD }, line: { color: NAVY, width: 1 }
    });
    stats.addText(String(val), {
      x, y: 1.9, w: cw, h: 1.05, fontFace: FONT, fontSize: 54, bold: true,
      color: accent, align: 'center', valign: 'middle', margin: 0
    });
    stats.addText(label, {
      x, y: 3.02, w: cw, h: 0.4, fontFace: FONT, fontSize: 13,
      color: MUTED, align: 'center', margin: 0
    });
    stats.addText((Math.round((val / total) * 100)) + '%', {
      x, y: 3.4, w: cw, h: 0.32, fontFace: FONT, fontSize: 11,
      color: MUTED, align: 'center', margin: 0
    });
  });
  addPager(stats, 3);

  // ---------- 4. 状态分布（原生图表 + 关键指标） ----------
  const chartSlide = pptx.addSlide();
  paintBg(chartSlide);
  chartSlide.addText('状态分布', { x: 0.5, y: 0.42, w: 9, h: 0.6, fontFace: FONT, fontSize: 30, bold: true, color: WHITE, margin: 0 });
  chartSlide.addChart(pptx.ChartType.doughnut, [{
    name: '任务状态',
    labels: ['待处理', '处理中', '已完成', '已取消'],
    values: [c.pending || 0, c.processing || 0, c.completed || 0, c.cancelled || 0]
  }], {
    x: 0.5, y: 1.36, w: 5.1, h: 3.6,
    chartColors: [ICE, MINT, '7BD88F', MUTED],
    holeSize: 55,
    showLegend: true, legendPos: 'b', legendColor: BODY, legendFontFace: FONT, legendFontSize: 11,
    showTitle: false,
    showPercent: true, dataLabelColor: WHITE, dataLabelFontFace: FONT, dataLabelFontSize: 11,
    border: { pt: 0, color: BG }
  });
  const doneRate = Math.round(((c.completed || 0) / total) * 100);
  chartSlide.addShape(pptx.ShapeType.roundRect, {
    x: 5.85, y: 1.5, w: 3.65, h: 1.5, rectRadius: 0.1,
    fill: { color: CARD }, line: { color: NAVY, width: 1 }
  });
  chartSlide.addText('完成率', { x: 6.05, y: 1.66, w: 3.25, h: 0.35, fontFace: FONT, fontSize: 13, color: MUTED, margin: 0 });
  chartSlide.addText(doneRate + '%', { x: 6.05, y: 2.02, w: 3.25, h: 0.82, fontFace: FONT, fontSize: 44, bold: true, color: MINT, margin: 0 });
  chartSlide.addShape(pptx.ShapeType.roundRect, {
    x: 5.85, y: 3.2, w: 3.65, h: 1.76, rectRadius: 0.1,
    fill: { color: CARD }, line: { color: NAVY, width: 1 }
  });
  chartSlide.addText(
    '共 ' + payload.list.length + ' 项任务\n已完成 ' + (c.completed || 0) + ' 项\n进行中 ' + ((c.processing || 0) + (c.pending || 0)) + ' 项',
    { x: 6.05, y: 3.4, w: 3.25, h: 1.4, fontFace: FONT, fontSize: 13, color: BODY, lineSpacingMultiple: 1.35, margin: 0 }
  );
  addPager(chartSlide, 4);

  // ---------- 5. 内容页 ----------
  // 依据条目数量自动选择字号，避免文字溢出
  const fitFont = (items) => {
    const chars = (items || []).reduce((n, s) => n + String(s).length, 0);
    if (chars > 420) return 11;
    if (chars > 300) return 12;
    if (chars > 190) return 13;
    return 15;
  };
  // bullet 数组：breakLine 只设在非末项
  const bulletRuns = (items) => items.map((t, i) => ({
    text: String(t),
    options: { bullet: true, breakLine: i < items.length - 1 }
  }));

  let secNo = 1;
  const contentSlide = (label, items, mode) => {
    const s = pptx.addSlide();
    paintBg(s);
    addDot(s, 8.95, 4.6, 2.2, NAVY, 68);
    addHeading(s, secNo, label);
    addPager(s, 4 + secNo);
    secNo++;

    if (mode === 'text') {
      s.addShape(pptx.ShapeType.roundRect, {
        x: 0.5, y: 1.2, w: 9, h: 4.0, rectRadius: 0.1,
        fill: { color: CARD }, line: { color: NAVY, width: 1 }
      });
      s.addText(items, {
        x: 0.85, y: 1.48, w: 8.3, h: 3.5, fontFace: FONT, fontSize: 15,
        color: BODY, lineSpacingMultiple: 1.5, valign: 'top', margin: 0
      });
    } else if (mode === 'steps') {
      // 编号步骤式：视觉母题复用
      items.forEach((t, i) => {
        const y = 1.24 + i * 0.68;
        s.addShape(pptx.ShapeType.ellipse, { x: 0.72, y: y, w: 0.36, h: 0.36, fill: { color: MINT }, line: { color: MINT, width: 0 } });
        s.addText(String(i + 1), { x: 0.72, y: y, w: 0.36, h: 0.36, fontFace: FONT, fontSize: 12, bold: true, color: '06251E', align: 'center', valign: 'middle', margin: 0 });
        s.addShape(pptx.ShapeType.roundRect, {
          x: 1.26, y: y - 0.06, w: 8.24, h: 0.6, rectRadius: 0.06,
          fill: { color: CARD }, line: { color: NAVY, width: 1 }
        });
        s.addText(String(t), { x: 1.48, y: y - 0.06, w: 7.86, h: 0.6, fontFace: FONT, fontSize: 12, color: BODY, valign: 'middle', margin: 0 });
      });
    } else {
      // 要点卡片式
      s.addShape(pptx.ShapeType.roundRect, {
        x: 0.5, y: 1.2, w: 9, h: 4.0, rectRadius: 0.1,
        fill: { color: CARD }, line: { color: NAVY, width: 1 }
      });
      const fs = fitFont(items);
      s.addText(bulletRuns(items), {
        x: 0.85, y: 1.46, w: 8.3, h: 3.55, fontFace: FONT, fontSize: fs,
        color: BODY, paraSpaceAfter: 10, valign: 'top', margin: 0
      });
    }
  };

  if (d.summary) contentSlide('概述', d.summary, 'text');
  contentSlide('数据汇总', [
    '待处理 ' + (c.pending || 0) + ' 项',
    '处理中 ' + (c.processing || 0) + ' 项',
    '已完成 ' + (c.completed || 0) + ' 项',
    '已取消 ' + (c.cancelled || 0) + ' 项'
  ], 'list');
  if (d.done && d.done.length) contentSlide('完成情况', d.done, 'list');
  if (d.progress && d.progress.length) contentSlide('重点进展', d.progress, 'list');
  if (d.risks && d.risks.length) contentSlide('问题与风险', d.risks, 'list');
  if (d.plan && d.plan.length) contentSlide('下阶段计划', d.plan, 'steps');

  // ---------- 6. 结束页 ----------
  const end = pptx.addSlide();
  paintBg(end);
  addDot(end, 7.2, -1.2, 3.8, NAVY, 55);
  addDot(end, -0.9, 3.4, 2.6, MINT, 78);
  end.addText('汇报完毕', {
    x: 0.7, y: 2.1, w: 8.6, h: 0.9, fontFace: FONT, fontSize: 34, bold: true,
    color: WHITE, align: 'center', valign: 'middle', margin: 0
  });
  end.addText(rangeText + '　·　共 ' + payload.list.length + ' 项任务', {
    x: 0.7, y: 3.14, w: 8.6, h: 0.4, fontFace: FONT, fontSize: 12, color: MUTED, align: 'center', margin: 0
  });

  await pptx.writeFile({ fileName: '工作汇报_' + fileStamp() + '.pptx' });
}

async function exportPdf() {
  if (!reportData) return;
  const el = document.getElementById('reportDoc');
  const btn = document.getElementById('exportPdfBtn');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ 生成中…';
  try {
    const canvas = await window.html2canvas(el, {
      backgroundColor: '#ffffff', scale: 2, useCORS: true,
      onclone: (cd) => {
        const c = cd.getElementById('reportDoc');
        if (!c) return;
        c.style.background = '#ffffff'; c.style.border = 'none'; c.style.color = '#000000';
        c.querySelectorAll('h1').forEach(h => {
          h.style.webkitTextFillColor = '#1a1a3e'; h.style.color = '#1a1a3e'; h.style.background = 'none';
        });
        c.querySelectorAll('h2').forEach(h => { h.style.color = '#333366'; });
        c.querySelectorAll('p, li').forEach(p => { p.style.color = '#000000'; });
      }
    });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    const imgH = canvas.height * pw / canvas.width;
    const img = canvas.toDataURL('image/jpeg', 0.92);
    let pos = 0, left = imgH;
    pdf.addImage(img, 'JPEG', 0, pos, pw, imgH);
    left -= ph;
    while (left > 0) {
      pos -= ph;
      pdf.addPage();
      pdf.addImage(img, 'JPEG', 0, pos, pw, imgH);
      left -= ph;
    }
    pdf.save('工作汇报_' + fileStamp() + '.pdf');
  } catch (e) {
    alert('PDF 生成失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

function exportPrint() {
  if (!reportData) return;
  window.print();
}

// ============================================================
//  初始化
// ============================================================
function init() {
  // 读取任务数据
  try {
    const raw = localStorage.getItem(PAYLOAD_KEY);
    payload = raw ? JSON.parse(raw) : null;
  } catch (e) { payload = null; }

  if (!payload || !payload.list || payload.list.length === 0) {
    document.getElementById('reportDoc').innerHTML =
      '<div class="placeholder">未读取到任务数据。<br>请返回看板，在统计面板点击「✨ AI 整理汇报」重新进入。</div>';
    document.getElementById('chatSend').disabled = true;
    document.getElementById('regenBtn').disabled = true;
    return;
  }

  document.getElementById('rangeInfo').textContent =
    '统计区间：' + (payload.startVal || '全部') + ' ~ ' + (payload.endVal || '全部')
    + '　共 ' + payload.list.length + ' 项任务';

  if (!getAiKey()) {
    document.getElementById('reportDoc').innerHTML =
      '<div class="placeholder">未配置 DeepSeek API Key。<br>请返回看板，在右上角「⚙️ AI 设置」中配置后再来。</div>';
    document.getElementById('chatSend').disabled = true;
    return;
  }

  // 事件绑定
  document.getElementById('regenBtn').addEventListener('click', generateInitial);
  document.getElementById('chatSend').addEventListener('click', sendRefinement);
  document.getElementById('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendRefinement(); }
  });
  document.getElementById('exportWordBtn').addEventListener('click', exportWord);
  document.getElementById('exportPdfBtn').addEventListener('click', exportPdf);
  document.getElementById('exportPrintBtn').addEventListener('click', exportPrint);
  document.getElementById('exportPptBtn').addEventListener('click', exportPpt);
  document.getElementById('backBtn').addEventListener('click', () => {
    if (window.opener) window.close();
    else location.href = './index.html';
  });

  generateInitial();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
